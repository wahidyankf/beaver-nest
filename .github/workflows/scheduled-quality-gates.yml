name: Scheduled quality gates

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-gates
  cancel-in-progress: false

jobs:
  ex-bdd-coverage:
    name: ExBdd complete engine coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Install ExBdd dependencies
        run: ./hippo run --class ephemeral --cwd libs/ex-bdd --disk-path libs/ex-bdd -- mix deps.get

      - name: Run complete ExBdd coverage
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p ex-bdd -t test:coverage

  badakmini-test-symphony:
    name: Badakmini test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.107"

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Run local integration suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli -t test:integration

      - name: Run process end-to-end suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli-e2e -t test:e2e

  bnest-test-symphony:
    name: Bnest test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Install Phoenix dependencies
        run: ./hippo run --class ephemeral --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      - name: Run local integration suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p bnest-app -t test:integration

      - name: Install Chromium and system dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- playwright install --with-deps chromium

      - name: Install pinned Caddy for routed rollout tests
        env:
          CADDY_VERSION: "2.11.4"
          CADDY_LINUX_AMD64_SHA512: "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9"
        run: |
          archive="${RUNNER_TEMP}/caddy.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${CADDY_LINUX_AMD64_SHA512}" "${archive}" | sha512sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" caddy
          install -m 0755 "${RUNNER_TEMP}/caddy" "${RUNNER_TEMP}/caddy-bin"
          printf '%s\n' "BNEST_E2E_CADDY_BIN=${RUNNER_TEMP}/caddy-bin" >> "${GITHUB_ENV}"

      - name: Run complete end-to-end suite
        run: npm exec -- nx run -p bnest-app-e2e -t test:e2e -- --workers=1
