name: Scheduled quality gates

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-gates
  cancel-in-progress: false

jobs:
  resource-guard-consumer:
    name: Resource guard consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify pinned bootstrap behavior
        run: ./.github/scripts/test-resource-guard-bootstrap.sh

      - name: Install and identify the pinned release
        run: ./resource-guard version --json

      - name: Inspect runner capacity
        run: ./resource-guard status --json --disk-path .

  ex-bdd-coverage:
    name: ExBdd unit and integration coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./resource-guard run --class ephemeral --disk-path . -- npm ci

      - name: Install ExBdd dependencies
        run: ./resource-guard run --class ephemeral --cwd libs/ex-bdd --disk-path libs/ex-bdd -- mix deps.get

      - name: Run complete ExBdd coverage
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- nx run -p ex-bdd -t test:coverage

  badakmini-test-symphony:
    name: Badakmini test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.107"

      - name: Install npm dependencies
        run: ./resource-guard run --class ephemeral --disk-path . -- npm ci

      - name: Run local integration suite
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli -t test:coverage:integration

      - name: Run process end-to-end suite
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli-e2e -t test:e2e

  bnest-test-symphony:
    name: Bnest test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./resource-guard run --class ephemeral --disk-path . -- npm ci

      - name: Install Phoenix dependencies
        run: ./resource-guard run --class ephemeral --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      - name: Run local integration suite
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- nx run -p bnest-app -t test:coverage:integration

      - name: Install Chromium and system dependencies
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- playwright install --with-deps chromium

      - name: Run complete end-to-end suite
        run: ./resource-guard run --class ephemeral --disk-path . -- npm exec -- nx run -p bnest-app-e2e -t test:e2e -- --workers=1
