name: Scheduled quality gates

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-gates
  cancel-in-progress: false

jobs:
  hippo-consumer:
    name: HIPPO consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify pinned bootstrap behaviour
        run: ./.github/scripts/test-hippo-bootstrap.sh

      - name: Install and identify the pinned release
        run: |
          set -eu
          ./hippo version --json > "${RUNNER_TEMP}/hippo-version.json"
          node - "${RUNNER_TEMP}/hippo-version.json" hippo.lock <<'NODE'
          const fs = require("node:fs");
          const identity = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const lock = Object.fromEntries(
            fs
              .readFileSync(process.argv[3], "utf8")
              .trim()
              .split("\n")
              .map((line) => line.split("=", 2)),
          );
          if (
            identity.schemaVersion !== 1 ||
            identity.version !== lock.version ||
            identity.commit !== lock.commit
          ) {
            throw new Error("installed HIPPO identity differs from hippo.lock");
          }
          NODE

      - name: Prove shared reservations mappings and cleanup
        run: |
          set -eu
          shared_root=$(mktemp -d "${RUNNER_TEMP}/hippo-shared.XXXXXX")
          release_file="${shared_root}/release"
          owner_one=
          owner_two=
          cleanup() {
            : > "${release_file}"
            for owner_pid in ${owner_one} ${owner_two}; do
              [ -n "${owner_pid}" ] || continue
              kill "${owner_pid}" 2>/dev/null || true
              wait "${owner_pid}" 2>/dev/null || true
            done
            rm -rf -- "${shared_root}"
          }
          trap cleanup EXIT HUP INT TERM

          for owner in one two; do
            # Variables in the single-quoted command expand inside the guarded child.
            # shellcheck disable=SC2016
            HIPPO_ROOT="${shared_root}" HIPPO_CONFIG="${GITHUB_WORKSPACE}/hippo.local.json.example" \
              ./hippo run --class ephemeral --reserve-cpu 1 --reserve-memory-mib 256 \
              --disk-path . -- sh -c '
                printf "%s\n%s\n%s\n" "$NX_PARALLEL" "$GOMAXPROCS" "$DOTNET_PROCESSOR_COUNT" > "$1"
                : > "$2"
                while [ ! -e "$3" ]; do sleep 0.1; done
              ' sh "${shared_root}/${owner}.mappings" "${shared_root}/${owner}.ready" "${release_file}" &
            if [ "${owner}" = one ]; then owner_one=$!; else owner_two=$!; fi
          done

          attempts=0
          until [ -f "${shared_root}/one.ready" ] && [ -f "${shared_root}/two.ready" ]; do
            kill -0 "${owner_one}" 2>/dev/null
            kill -0 "${owner_two}" 2>/dev/null
            attempts=$((attempts + 1))
            [ "${attempts}" -lt 300 ]
            sleep 0.1
          done

          HIPPO_ROOT="${shared_root}" HIPPO_CONFIG="${GITHUB_WORKSPACE}/hippo.local.json.example" \
            ./hippo status --json --disk-path . > "${shared_root}/active.json"
          node - "${shared_root}/active.json" <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const coordination = status.coordination;
          if (
            status.schemaVersion !== 4 ||
            coordination?.schemaVersion !== 4 ||
            coordination.mode !== "reservation" ||
            coordination.activeOwners !== 2 ||
            coordination.waitingOwners !== 0 ||
            coordination.allocated?.cpu !== 2 ||
            coordination.allocated?.memoryBytes !== 536870912
          ) {
            throw new Error("active shared-root reservation evidence is incomplete");
          }
          NODE
          printf '1\n1\n1\n' > "${shared_root}/expected.mappings"
          diff -u "${shared_root}/expected.mappings" "${shared_root}/one.mappings"
          diff -u "${shared_root}/expected.mappings" "${shared_root}/two.mappings"

          : > "${release_file}"
          wait "${owner_one}"
          wait "${owner_two}"
          owner_one=
          owner_two=
          HIPPO_ROOT="${shared_root}" HIPPO_CONFIG="${GITHUB_WORKSPACE}/hippo.local.json.example" \
            ./hippo status --json --disk-path . > "${shared_root}/released.json"
          node - "${shared_root}/released.json" <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const coordination = status.coordination;
          if (
            status.schemaVersion !== 4 ||
            coordination?.activeOwners !== 0 ||
            coordination.waitingOwners !== 0 ||
            coordination.allocated?.cpu !== 0 ||
            coordination.allocated?.memoryBytes !== 0
          ) {
            throw new Error("released reservation remains in shared-root accounting");
          }
          NODE

  ex-bdd-coverage:
    name: ExBdd unit and integration coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Install ExBdd dependencies
        run: ./hippo run --class ephemeral --cwd libs/ex-bdd --disk-path libs/ex-bdd -- mix deps.get

      - name: Run complete ExBdd coverage
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p ex-bdd -t test:coverage

  badakmini-test-symphony:
    name: Badakmini test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.107"

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Run local integration suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli -t test:coverage:integration

      - name: Run process end-to-end suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p badakmini-cli-e2e -t test:e2e

  bnest-test-symphony:
    name: Bnest test symphony
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm ci

      - name: Install Phoenix dependencies
        run: ./hippo run --class ephemeral --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      - name: Run local integration suite
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- nx run -p bnest-app -t test:coverage:integration

      - name: Install Chromium and system dependencies
        run: ./hippo run --class ephemeral --disk-path . -- npm exec -- playwright install --with-deps chromium

      - name: Install pinned Caddy for routed rollout tests
        env:
          CADDY_VERSION: "2.11.4"
          CADDY_LINUX_AMD64_SHA512: "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9"
        run: |
          archive="${RUNNER_TEMP}/caddy.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${CADDY_LINUX_AMD64_SHA512}" "${archive}" | sha512sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" caddy
          install -m 0755 "${RUNNER_TEMP}/caddy" "${RUNNER_TEMP}/caddy-bin"
          printf '%s\n' "BNEST_E2E_CADDY_BIN=${RUNNER_TEMP}/caddy-bin" >> "${GITHUB_ENV}"

      - name: Run complete end-to-end suite
        run: npm exec -- nx run -p bnest-app-e2e -t test:e2e -- --workers=1
