name: PR Quality Gate

# The pull-request surface of the registry in `repo-config.yml` runs here, from
# any checkout (C8). This workflow is a superset of the local hooks: it replays
# every hook check, and it runs every other pull-request entry in parallel jobs.
# One aggregate job named `quality-gate` is the single required result.
#
# The gates come only from the registry (C1). Each job selects its entries with
# `--entry`, so no job copies a gate's command, and every pull-request entry runs
# in exactly one job. Each compute step runs under one HIPPO boundary. Every
# action reference names a full commit SHA, with its release tag in a comment.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Every gate mirrored here runs offline against the local hook contract.
  NX_NO_CLOUD: "true"

jobs:
  # The global checks: the tree, range, and document checks, the repository
  # contract, the bootstrap tests, and the behaviour binding check. Each one reads
  # the whole repository or the explicit range, so none is narrowed to a project.
  global-checks:
    name: Global checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The pull request head with its history: the explicit range reads commits.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install npm dependencies
        run: ./hippo run --class transactional --resource-tier standard --disk-path . -- npm ci

      # The `rhino-bootstrap-lint` entry lints the RHINO bootstrap. Pinned to the
      # version this workstation runs: the runner image ships an older ShellCheck
      # that emits SC2015 for `A && B || C`, an idiom the bootstrap uses correctly.
      # Checksum-verified, because an unverified download in a gate is a supply
      # chain this repository did not choose.
      - name: Install the pinned ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_LINUX_X86_64_SHA512: "25df28923d7d89cfdb9fa8aeef762a887f2bd4ebfbcd43ae71068c60e9458d66250b0f8d6fd66b4bc03723e6cdd47983c547e3ab4f3ea2cbc4bc4028842cc7b9"
        run: |
          set -eu
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_LINUX_X86_64_SHA512}" "${archive}" | sha512sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # A dedicated directory, not RUNNER_TEMP itself: prepending the whole
          # scratch directory to PATH would make every file dropped there by any
          # step resolvable as a command.
          mkdir -p "${RUNNER_TEMP}/pinned-bin"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/pinned-bin/shellcheck"
          printf '%s\n' "${RUNNER_TEMP}/pinned-bin" >> "${GITHUB_PATH}"

      - name: Run the global checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request \
              --entry public-safety-tree --entry public-safety-range \
              --entry public-safety-tests --entry remote-dispatch-refusal \
              --entry repo-config --entry word-budget --entry directory-map \
              --entry quality-gates --entry harness-adapters --entry internal-links \
              --entry mermaid --entry markdownlint --entry behaviour-coverage \
              --entry hippo-bootstrap-test --entry rhino-bootstrap-lint \
              --entry rhino-consumer-repo \
              --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # The commit-message lint, per commit and over the range. Both entries read the
  # explicit range, so the head needs its history.
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install npm dependencies
        run: ./hippo run --class transactional --resource-tier standard --disk-path . -- npm ci

      - name: Lint the commit messages of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          ./hippo run --class ephemeral --resource-tier light --disk-path . -- \
            ./rhino gate run --surface pull-request \
              --entry commit-message --entry commit-history \
              --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # One parallel job per project's quick suite. A project's job names its own
  # entry, and only the Elixir project installs the Phoenix toolchain.
  test-quick:
    name: Test quick (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [bnest-app, bnest-app-be-e2e, bnest-app-fe-e2e]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install npm dependencies
        run: ./hippo run --class transactional --resource-tier standard --disk-path . -- npm ci

      - name: Set up Erlang and Elixir
        if: matrix.project == 'bnest-app'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
          version-type: strict

      - name: Install Phoenix dependencies
        if: matrix.project == 'bnest-app'
        run: ./hippo run --class transactional --resource-tier standard --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      # `test:quick` runs `mix dialyzer`, which rebuilds its PLT from the whole OTP
      # and dependency set on a cold runner. The key tracks the exact toolchain and
      # dependency set the PLT is derived from.
      - name: Cache the Dialyzer PLT
        if: matrix.project == 'bnest-app'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/bnest-app/_build/test/*.plt*
          key: plt-bnest-app-otp29.1.2-ex1.20.4-${{ hashFiles('apps/bnest-app/mix.lock') }}
          restore-keys: |
            plt-bnest-app-otp29.1.2-ex1.20.4-

      - name: Run the project's quick suite
        run: |
          set -eu
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request --entry test-quick-${{ matrix.project }}

  # The integration suites: local values only, so every pull request runs them (C17).
  test-integration:
    name: Test integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class transactional --resource-tier standard --disk-path . -- npm ci

      - name: Install Phoenix dependencies
        run: ./hippo run --class transactional --resource-tier standard --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      - name: Run the integration suites
        run: |
          set -eu
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request --entry test-integration

  # The formatters replayed over the range, and the Elixir format check. Each
  # verifies that the change is already formatted rather than rewriting it.
  verify-clean:
    name: Verify clean formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
          version-type: strict

      - name: Install npm dependencies
        run: ./hippo run --class transactional --resource-tier standard --disk-path . -- npm ci

      - name: Install Phoenix dependencies
        run: ./hippo run --class transactional --resource-tier standard --cwd apps/bnest-app --disk-path apps/bnest-app -- mix deps.get

      - name: Verify the formatting entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request \
              --entry format-staged --entry prettier-check --entry format-elixir \
              --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # The single required status check. A skipped or cancelled dependency is not a
  # pass, so only an explicit success from every job may open the merge button.
  quality-gate:
    name: quality-gate
    needs:
      - global-checks
      - commit-messages
      - test-quick
      - test-integration
      - verify-clean
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "Gate results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "A quality gate job did not succeed." >&2
              exit 1
            fi
          done
          echo "All quality gates passed."
