name: Full end-to-end tests

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-e2e
  cancel-in-progress: false

jobs:
  test:
    name: Playwright full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Install npm dependencies
        run: npm ci

      - name: Install Phoenix dependencies
        run: mix deps.get
        working-directory: apps/bnest-app

      - name: Install Chromium and system dependencies
        run: npm exec -- playwright install --with-deps chromium

      - name: Run complete end-to-end suite
        run: npm exec -- nx run -p bnest-e2e -t test:e2e -- --workers=1
