name: HIPPO Consumer Smoke

on:
  # A Linux-only retention defect once reached main because this suite ran on no
  # per-push surface at all, only a twice-daily schedule that had not fired since
  # the consumer was migrated. This repository delivers straight to main, so a
  # push trigger is the earliest Linux signal available to it: the commit still
  # lands, but Linux reports within minutes instead of up to twelve hours.
  push:
    branches: [main]
    paths:
      - hippo
      - hippo.lock
      - hippo.local.json.example
      - .github/scripts/test-hippo-bootstrap.sh
      - .github/workflows/hippo-consumer-smoke.yml
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hippo-consumer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hippo-consumer:
    name: HIPPO consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify pinned bootstrap behaviour
        run: ./.github/scripts/test-hippo-bootstrap.sh

      - name: Install and identify the pinned release
        run: |
          set -eu
          ./hippo version --json > "${RUNNER_TEMP}/hippo-version.json"
          node - "${RUNNER_TEMP}/hippo-version.json" hippo.lock <<'NODE'
          const fs = require("node:fs");
          const identity = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const lock = Object.fromEntries(
            fs
              .readFileSync(process.argv[3], "utf8")
              .trim()
              .split("\n")
              .map((line) => line.split("=", 2)),
          );
          if (
            identity.schemaVersion !== 1 ||
            identity.version !== lock.version ||
            identity.commit !== lock.commit
          ) {
            throw new Error("installed HIPPO identity differs from hippo.lock");
          }
          NODE

      - name: Prove shared reservations mappings and cleanup
        run: |
          set -eu
          shared_root=$(mktemp -d "${RUNNER_TEMP}/hippo-shared.XXXXXX")
          release_file="${shared_root}/release"
          owner_one=
          owner_two=
          cleanup() {
            : > "${release_file}"
            for owner_pid in ${owner_one} ${owner_two}; do
              [ -n "${owner_pid}" ] || continue
              kill "${owner_pid}" 2>/dev/null || true
              wait "${owner_pid}" 2>/dev/null || true
            done
            rm -rf -- "${shared_root}"
          }
          trap cleanup EXIT HUP INT TERM

          cat > "${shared_root}/assert-active.js" <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const coordination = status.coordination;
          if (
            status.schemaVersion !== 4 ||
            coordination?.schemaVersion !== 4 ||
            coordination.mode !== "reservation" ||
            coordination.activeOwners !== 2 ||
            coordination.waitingOwners !== 0 ||
            coordination.allocated?.cpu !== 2 ||
            coordination.allocated?.memoryBytes !== 536870912
          ) {
            throw new Error(
              "active shared-root reservation evidence is incomplete: " + JSON.stringify(coordination),
            );
          }
          NODE
          cat > "${shared_root}/assert-released.js" <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const coordination = status.coordination;
          if (
            status.schemaVersion !== 4 ||
            coordination?.activeOwners !== 0 ||
            coordination.waitingOwners !== 0 ||
            coordination.allocated?.cpu !== 0 ||
            coordination.allocated?.memoryBytes !== 0
          ) {
            throw new Error(
              "released reservation remains in shared-root accounting: " + JSON.stringify(coordination),
            );
          }
          NODE

          # Poll rather than sample once. Both reads below observe a root that two live
          # guarded children share, so a single sample can land inside a peer's bounded
          # transaction. The property under test is unchanged and still enforced: the
          # accounting must reach the expected vector, and this fails if it never does.
          await_status() {
            assertion=$1
            attempts=0
            while :; do
              set +e
              HIPPO_ROOT="${shared_root}" HIPPO_CONFIG="${GITHUB_WORKSPACE}/hippo.local.json.example" \
                ./hippo status --json --disk-path . \
                > "${shared_root}/status.json" 2> "${shared_root}/status.err"
              status_code=$?
              if [ "${status_code}" -eq 0 ]; then
                failure=$(node "${assertion}" "${shared_root}/status.json" 2>&1)
                assert_code=$?
              else
                failure=$(cat "${shared_root}/status.err")
                assert_code=1
              fi
              set -e
              [ "${assert_code}" -ne 0 ] || return 0
              attempts=$((attempts + 1))
              if [ "${attempts}" -ge 100 ]; then
                echo "${failure}" >&2
                return 1
              fi
              sleep 0.1
            done
          }

          # Exit 75 is HIPPO's documented retryable deferral, and an owner can receive it
          # after its child is already running: activation records the supervised process
          # group once the child exists, and a child whose process group was never
          # recorded cannot be selected under critical pressure, so HIPPO stops it rather
          # than leave an unsheddable owner behind. Every repository on the host shares
          # one coordination root, so losing that bounded window is ordinary contention
          # and the caller retries. Treating the deferral as an admission is what made
          # this step fail on Linux while passing on macOS.
          launch_owner() {
            owner_name=$1
            mappings="${shared_root}/${owner_name}.mappings"
            ready="${shared_root}/${owner_name}.ready"
            deferrals=0
            while :; do
              # The readiness marker only ever means "an admitted child is running now",
              # so a deferred attempt must not leave its marker behind for the next one.
              rm -f "${ready}"
              set +e
              # Variables in the single-quoted command expand inside the guarded child.
              # shellcheck disable=SC2016
              HIPPO_ROOT="${shared_root}" HIPPO_CONFIG="${GITHUB_WORKSPACE}/hippo.local.json.example" \
                ./hippo run --class ephemeral --reserve-cpu 1 --reserve-memory-mib 256 \
                --disk-path . -- sh -c '
                  printf "%s\n%s\n%s\n" "$NX_PARALLEL" "$GOMAXPROCS" "$DOTNET_PROCESSOR_COUNT" > "$1"
                  : > "$2"
                  while [ ! -e "$3" ]; do sleep 0.1; done
                ' sh "${mappings}" "${ready}" "${release_file}"
              owner_code=$?
              set -e
              if [ "${owner_code}" -ne 75 ]; then
                return "${owner_code}"
              fi
              deferrals=$((deferrals + 1))
              if [ "${deferrals}" -ge 20 ]; then
                echo "owner ${owner_name} was deferred ${deferrals} times without admission" >&2
                return 75
              fi
              sleep 0.2
            done
          }

          launch_owner one &
          owner_one=$!
          launch_owner two &
          owner_two=$!

          attempts=0
          until [ -f "${shared_root}/one.ready" ] && [ -f "${shared_root}/two.ready" ]; do
            if ! kill -0 "${owner_one}" 2>/dev/null || ! kill -0 "${owner_two}" 2>/dev/null; then
              echo "an owner exited before both reservations were admitted" >&2
              exit 1
            fi
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge 600 ]; then
              echo "owners did not both reach admission within the bounded wait" >&2
              exit 1
            fi
            sleep 0.1
          done

          await_status "${shared_root}/assert-active.js"
          printf '1\n1\n1\n' > "${shared_root}/expected.mappings"
          diff -u "${shared_root}/expected.mappings" "${shared_root}/one.mappings"
          diff -u "${shared_root}/expected.mappings" "${shared_root}/two.mappings"

          : > "${release_file}"
          set +e
          wait "${owner_one}"
          owner_one_code=$?
          wait "${owner_two}"
          owner_two_code=$?
          set -e
          owner_one=
          owner_two=
          if [ "${owner_one_code}" -ne 0 ] || [ "${owner_two_code}" -ne 0 ]; then
            echo "owners exited ${owner_one_code} and ${owner_two_code}, want 0 and 0" >&2
            exit 1
          fi
          await_status "${shared_root}/assert-released.js"
