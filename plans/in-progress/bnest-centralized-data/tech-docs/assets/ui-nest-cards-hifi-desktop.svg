  <g font-family="Arial" font-size="15" font-weight="700"><rect x="84" y="226" width="330" height="52" rx="18" fill="#153f42"/><text x="112" y="259" fill="#fff9ed">1 · Add family members</text><rect x="428" y="226" width="330" height="52" rx="18" fill="#fff9ed" stroke="#153f42" stroke-width="2"/><text x="456" y="259" fill="#153f42">2 · Review roles</text><rect x="772" y="226" width="330" height="52" rx="18" fill="#fff9ed" stroke="#153f42" stroke-width="2"/><text x="800" y="259" fill="#153f42">3 · Close setup</text></g>
