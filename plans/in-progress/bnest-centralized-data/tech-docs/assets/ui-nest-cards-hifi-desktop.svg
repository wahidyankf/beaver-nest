<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="nest-hifi-desktop-title nest-hifi-desktop-desc" data-plan-artifact="true">
  <title id="nest-hifi-desktop-title">Selected Nest Cards desktop mockup</title><desc id="nest-hifi-desktop-desc">A colorful Bnest account setup with a guided form, playful nest motif, and family account summary on desktop.</desc>
  <defs><pattern id="desktop-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#47857a" opacity=".28"/></pattern></defs>
  <rect width="1440" height="900" fill="#d8f1ec"/><rect width="1440" height="900" fill="url(#desktop-dots)"/>
  <circle cx="1300" cy="110" r="118" fill="#f7b84b"/><circle cx="95" cy="790" r="145" fill="#80c5b8"/>
  <g transform="translate(84 56)"><path d="M8 40 C30 6 82 6 104 40" fill="none" stroke="#153f42" stroke-width="10" stroke-linecap="round"/><path d="M20 48 C40 22 72 22 92 48" fill="none" stroke="#e5633d" stroke-width="8" stroke-linecap="round"/><circle cx="56" cy="50" r="8" fill="#f7b84b"/></g>
