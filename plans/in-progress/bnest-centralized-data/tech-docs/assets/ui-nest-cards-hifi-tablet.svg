<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="nest-hifi-tablet-title nest-hifi-tablet-desc" data-plan-artifact="true">
  <title id="nest-hifi-tablet-title">Selected Nest Cards tablet mockup</title><desc id="nest-hifi-tablet-desc">A colorful Bnest tablet setup with a compact progress strip, account form, and two-card family summary.</desc>
  <defs><pattern id="tablet-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#47857a" opacity=".25"/></pattern></defs><rect width="768" height="1024" fill="#d8f1ec"/><rect width="768" height="1024" fill="url(#tablet-dots)"/><circle cx="702" cy="70" r="86" fill="#f7b84b"/>
  <g transform="translate(44 34)"><path d="M4 34 C24 4 68 4 88 34" fill="none" stroke="#153f42" stroke-width="9" stroke-linecap="round"/><path d="M16 42 C32 20 60 20 76 42" fill="none" stroke="#e5633d" stroke-width="7" stroke-linecap="round"/></g><text x="146" y="72" font-family="Arial Rounded MT Bold, Arial" font-size="21" font-weight="700" fill="#153f42">BEAVER NEST</text>
  <text x="44" y="132" font-family="Arial Rounded MT Bold, Arial" font-size="32" font-weight="700" fill="#153f42">Set up your family nest</text><text x="44" y="166" font-family="Arial" font-size="15" fill="#205c5d">Create accounts once. Review before setup closes.</text>
  <g font-family="Arial" font-size="13" font-weight="700"><rect x="44" y="198" width="218" height="46" rx="15" fill="#153f42"/><text x="65" y="227" fill="#fff9ed">1 · Accounts</text><rect x="274" y="198" width="218" height="46" rx="15" fill="#fff9ed" stroke="#153f42" stroke-width="2"/><text x="295" y="227" fill="#153f42">2 · Review</text><rect x="504" y="198" width="218" height="46" rx="15" fill="#fff9ed" stroke="#153f42" stroke-width="2"/><text x="525" y="227" fill="#153f42">3 · Finish</text></g>
  <rect x="50" y="282" width="674" height="466" rx="26" fill="#153f42" opacity=".18"/><rect x="44" y="276" width="674" height="466" rx="26" fill="#fff9ed" stroke="#153f42" stroke-width="3"/><text x="82" y="328" font-family="Arial Rounded MT Bold, Arial" font-size="23" font-weight="700" fill="#153f42">Account 2 of 3</text><rect x="578" y="301" width="104" height="36" rx="18" fill="#f7b84b"/><text x="605" y="325" font-family="Arial" font-size="13" font-weight="700" fill="#153f42">CHILD</text>
  <g font-family="Arial" font-size="14" fill="#153f42"><text x="82" y="372" font-weight="700">Username</text><rect x="82" y="387" width="598" height="54" rx="11" fill="#fff" stroke="#205c5d" stroke-width="2"/><text x="102" y="421" fill="#47857a">test-user-child</text><text x="82" y="483" font-weight="700">Password</text><rect x="82" y="498" width="598" height="54" rx="11" fill="#fff" stroke="#205c5d" stroke-width="2"/><text x="102" y="532">••••••••••••</text><text x="82" y="594" font-weight="700">Roles</text><rect x="82" y="612" width="146" height="44" rx="22" fill="#f7b84b" stroke="#153f42" stroke-width="2"/><text x="112" y="640">✓ children</text><rect x="240" y="612" width="132" height="44" rx="22" fill="#fff" stroke="#153f42" stroke-width="2"/><text x="272" y="640">parents</text><rect x="384" y="612" width="118" height="44" rx="22" fill="#fff" stroke="#153f42" stroke-width="2"/><text x="420" y="640">admin</text></g><rect x="496" y="682" width="184" height="46" rx="13" fill="#153f42"/><text x="537" y="711" fill="#fff9ed" font-family="Arial" font-size="15" font-weight="700">Save account →</text>
  <text x="44" y="800" font-family="Arial Rounded MT Bold, Arial" font-size="22" font-weight="700" fill="#153f42">Your family nest</text><g font-family="Arial" fill="#153f42"><rect x="44" y="828" width="324" height="122" rx="20" fill="#f7b84b" stroke="#153f42" stroke-width="3"/><text x="72" y="870" font-size="16" font-weight="700">test-user-parent</text><text x="72" y="899" font-size="14">parents · admin</text><text x="72" y="927" font-size="14" font-weight="700">Ready ✓</text><rect x="384" y="828" width="338" height="122" rx="20" fill="#fff9ed" stroke="#153f42" stroke-width="3" stroke-dasharray="8 6"/><text x="412" y="870" font-size="16" font-weight="700">test-user-child</text><text x="412" y="899" font-size="14">children</text><text x="412" y="927" font-size="14" font-weight="700">Editing</text></g>
