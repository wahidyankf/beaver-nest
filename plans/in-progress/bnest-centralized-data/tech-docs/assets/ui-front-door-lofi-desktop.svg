<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="door-lofi-desktop-title door-lofi-desktop-desc" data-plan-artifact="true">
  <title id="door-lofi-desktop-title">Front Door desktop lo-fi wireframe</title><desc id="door-lofi-desktop-desc">A grayscale desktop setup with explanatory copy on the left and one focused progressive form on the right.</desc>
  <rect width="1440" height="900" fill="#eee"/><rect x="74" y="58" width="1292" height="784" rx="30" fill="#fff" stroke="#333" stroke-width="3"/>
  <rect x="74" y="58" width="532" height="784" rx="30" fill="#ddd"/><text x="132" y="150" font-family="Arial" font-size="30" font-weight="700">WELCOME HOME</text><text x="132" y="198" font-family="Arial" font-size="18">Create private access for your family.</text><g font-family="Arial" font-size="16"><text x="132" y="282">1  Add each family member</text><text x="132" y="332">2  Assign one or more roles</text><text x="132" y="382">3  Review and close setup</text></g><rect x="132" y="472" width="402" height="164" rx="18" fill="#fff" stroke="#555"/><text x="164" y="516" font-family="Arial" font-size="17" font-weight="700">Why setup closes</text><text x="164" y="552" font-family="Arial" font-size="15">There is no public registration.</text><text x="164" y="582" font-family="Arial" font-size="15">An administrator manages access.</text>
  <text x="696" y="130" font-family="Arial" font-size="15">STEP 1 OF 3</text><text x="696" y="182" font-family="Arial" font-size="27" font-weight="700">Add the first administrator</text>
  <g font-family="Arial" font-size="15"><text x="696" y="246">Username</text><rect x="696" y="262" width="552" height="58" rx="10" fill="#fff" stroke="#555"/><text x="718" y="298" fill="#555">test-user-parent</text><text x="696" y="364">Password</text><rect x="696" y="380" width="552" height="58" rx="10" fill="#fff" stroke="#555"/><text x="718" y="416">••••••••••••</text><text x="696" y="482">Roles</text><rect x="696" y="502" width="138" height="46" rx="23" fill="#fff" stroke="#555"/><text x="731" y="531">parents</text><rect x="850" y="502" width="120" height="46" rx="23" fill="#222"/><text x="885" y="531" fill="#fff">✓ admin</text></g>
  <rect x="1038" y="684" width="210" height="56" rx="12" fill="#222"/><text x="1091" y="719" fill="#fff" font-family="Arial" font-size="16">Continue</text><text x="696" y="790" font-family="Arial" font-size="14">One focused step at a time · Account summary appears during review</text>
</svg>
