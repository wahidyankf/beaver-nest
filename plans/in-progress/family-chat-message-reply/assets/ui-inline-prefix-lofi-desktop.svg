<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Inline prefix lo-fi desktop</title>
  <desc id="desc">Rejected desktop alternative: each reply carries its quote as one condensed prefix line, and the actions appear as a floating toolbar above the hovered message rather than a menu, leaving no stable target for keyboard focus.</desc>
  <rect width="1440" height="900" fill="#fff"/>
  <rect width="1440" height="96" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="48" y="46" font-family="sans-serif" font-size="20" font-weight="700">Family chat</text>
  <text x="48" y="72" font-family="sans-serif" font-size="15">Ruang Keluarga</text>

  <rect x="280" y="190" width="520" height="84" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="304" y="218" font-family="sans-serif" font-size="13" font-weight="700">Ayah · 16:02</text>
  <text x="304" y="250" font-family="sans-serif" font-size="17">Nanti aku jemput jam 5</text>

  <rect x="560" y="142" width="250" height="40" rx="20" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="580" y="168" font-family="sans-serif" font-size="14" font-weight="700">↩ Reply</text>
  <text x="672" y="168" font-family="sans-serif" font-size="14">❐ Copy</text>
  <text x="820" y="168" font-family="sans-serif" font-size="11" font-weight="700">Toolbar has no owning element for focus to return to</text>

  <rect x="280" y="306" width="520" height="66" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="304" y="333" font-family="sans-serif" font-size="13" font-weight="700">Kakak · 16:03</text>
  <text x="304" y="358" font-family="sans-serif" font-size="16">Aku pulang sendiri aja</text>

  <rect x="640" y="404" width="520" height="104" rx="18" fill="#596362"/>
  <text x="664" y="431" font-family="sans-serif" font-size="13" fill="#fff" font-weight="700">Bunda · 16:05</text>
  <text x="664" y="455" font-family="sans-serif" font-size="13" fill="#fff">↩ Ayah: Nanti aku jemput jam 5</text>
  <text x="664" y="490" font-family="sans-serif" font-size="17" fill="#fff">Oke, aku siapin</text>
  <text x="640" y="534" font-family="sans-serif" font-size="11" font-weight="700">At 1440 px the prefix line is far from the body it belongs to</text>

  <rect y="764" width="1440" height="136" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="280" y="794" font-family="sans-serif" font-size="13" font-weight="700">↩ Ayah: Nanti aku jemput jam 5    ×</text>
  <rect x="280" y="806" width="750" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="1046" y="806" width="114" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="1076" y="847" font-family="sans-serif" font-size="16" font-weight="700">Send</text>
</svg>
