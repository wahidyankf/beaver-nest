<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1112" viewBox="0 0 834 1112" role="img" aria-labelledby="title desc">
  <title id="title">Inline prefix lo-fi tablet</title>
  <desc id="desc">Rejected tablet alternative: quoted messages appear as single condensed prefix lines inside each reply bubble, and the floating action toolbar overlaps neighbouring messages instead of being anchored beside the held one.</desc>
  <rect width="834" height="1112" fill="#fff"/>
  <rect width="834" height="110" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="40" y="48" font-family="sans-serif" font-size="20" font-weight="700">Family chat</text>
  <text x="40" y="74" font-family="sans-serif" font-size="15">Ruang Keluarga</text>

  <rect x="40" y="196" width="430" height="82" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="60" y="223" font-family="sans-serif" font-size="13" font-weight="700">Ayah · 16:02</text>
  <text x="60" y="254" font-family="sans-serif" font-size="17">Nanti aku jemput jam 5</text>

  <rect x="40" y="146" width="250" height="40" rx="20" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="60" y="172" font-family="sans-serif" font-size="14" font-weight="700">↩ Reply</text>
  <text x="152" y="172" font-family="sans-serif" font-size="14">❐ Copy</text>
  <text x="40" y="134" font-family="sans-serif" font-size="11" font-weight="700">Toolbar overlaps whatever is above the held message</text>

  <rect x="40" y="294" width="430" height="66" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="60" y="321" font-family="sans-serif" font-size="13" font-weight="700">Kakak · 16:03</text>
  <text x="60" y="346" font-family="sans-serif" font-size="16">Aku pulang sendiri aja</text>

  <rect x="364" y="378" width="430" height="104" rx="18" fill="#596362"/>
  <text x="384" y="405" font-family="sans-serif" font-size="13" fill="#fff" font-weight="700">Bunda · 16:05</text>
  <text x="384" y="429" font-family="sans-serif" font-size="13" fill="#fff">↩ Ayah: Nanti aku jemput jam 5</text>
  <text x="384" y="464" font-family="sans-serif" font-size="17" fill="#fff">Oke, aku siapin</text>

  <rect y="976" width="834" height="136" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="40" y="1006" font-family="sans-serif" font-size="13" font-weight="700">↩ Ayah: Nanti aku jemput jam 5    ×</text>
  <rect x="40" y="1018" width="630" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="686" y="1018" width="108" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="714" y="1059" font-family="sans-serif" font-size="16" font-weight="700">Send</text>
</svg>
