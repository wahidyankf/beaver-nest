<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1112" viewBox="0 0 834 1112" role="img" aria-labelledby="title desc">
  <title id="title">Thread rail lo-fi tablet</title>
  <desc id="desc">Rejected tablet alternative: replies are grouped under their parent behind a connector rail with a collapse control, which reorders the conversation away from strict chronology and hides messages behind an extra step.</desc>
  <rect width="834" height="1112" fill="#fff"/>
  <rect width="834" height="110" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="40" y="48" font-family="sans-serif" font-size="20" font-weight="700">Family chat</text>
  <text x="40" y="74" font-family="sans-serif" font-size="15">Ruang Keluarga</text>

  <rect x="40" y="160" width="470" height="82" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="60" y="187" font-family="sans-serif" font-size="13" font-weight="700">Ayah · 16:02</text>
  <text x="60" y="218" font-family="sans-serif" font-size="17">Nanti aku jemput jam 5</text>

  <path d="M66 242 V 300 H 104" fill="none" stroke="#283433" stroke-width="3"/>
  <rect x="104" y="268" width="470" height="74" rx="18" fill="#596362"/>
  <text x="124" y="295" font-family="sans-serif" font-size="13" fill="#fff" font-weight="700">Bunda · 16:05</text>
  <text x="124" y="326" font-family="sans-serif" font-size="17" fill="#fff">Oke, aku siapin</text>

  <path d="M66 342 V 400 H 104" fill="none" stroke="#283433" stroke-width="3"/>
  <rect x="104" y="368" width="470" height="74" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="124" y="395" font-family="sans-serif" font-size="13" font-weight="700">Adik · 16:11</text>
  <text x="124" y="426" font-family="sans-serif" font-size="17">Aku ikut ya</text>

  <rect x="104" y="456" width="200" height="34" rx="17" fill="#e5e8e7" stroke="#283433" stroke-width="2"/>
  <text x="124" y="479" font-family="sans-serif" font-size="13" font-weight="700">Collapse 2 replies</text>

  <rect x="40" y="512" width="470" height="66" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="60" y="539" font-family="sans-serif" font-size="13" font-weight="700">Kakak · 16:03</text>
  <text x="60" y="564" font-family="sans-serif" font-size="16">Aku pulang sendiri aja</text>
  <text x="40" y="606" font-family="sans-serif" font-size="12" font-weight="700">A collapsed group hides committed messages the room promised to show</text>

  <rect y="976" width="834" height="136" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="40" y="1006" font-family="sans-serif" font-size="13" font-weight="700">Replying in Ayah's thread    ×</text>
  <rect x="40" y="1018" width="630" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="686" y="1018" width="108" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="714" y="1059" font-family="sans-serif" font-size="16" font-weight="700">Send</text>
</svg>
