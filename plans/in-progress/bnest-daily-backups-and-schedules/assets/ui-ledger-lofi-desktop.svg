<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Context settings ledger lo-fi desktop</title>
  <desc id="desc">Desktop wireframe with settings navigation, family and admin-system schedules, expiry, and configuration rail.</desc>
  <rect width="1440" height="900" fill="#f3f3f3"/>
  <rect x="48" y="32" width="1344" height="64" rx="8" fill="#d5d5d5"/>
  <text x="80" y="72" font-family="sans-serif" font-size="20">← Admin settings</text>
  <text x="64" y="152" font-family="sans-serif" font-size="36">Schedules &amp; backups</text>
  <rect x="64" y="190" width="840" height="610" rx="12" fill="#fff" stroke="#777" stroke-width="2"/>
  <text x="94" y="238" font-family="sans-serif" font-size="20">Family schedules · None</text>
  <path d="M94 270H874M94 350H874M94 430H874" stroke="#aaa" stroke-width="2"/>
  <text x="110" y="318" font-family="sans-serif" font-size="18">Admin/system · Production backup</text>
  <text x="610" y="318" font-family="sans-serif" font-size="18">Verified · Never expires</text>
  <rect x="936" y="190" width="456" height="610" rx="12" fill="#fff" stroke="#777" stroke-width="2"/>
  <text x="968" y="238" font-family="sans-serif" font-size="20">Backup settings</text>
  <rect x="968" y="286" width="392" height="52" rx="6" fill="#eee" stroke="#888"/>
  <text x="984" y="318" font-family="sans-serif" font-size="16">@data/backup/ · 7 days</text>
  <rect x="968" y="366" width="240" height="52" rx="6" fill="#bbb"/>
  <text x="990" y="398" font-family="sans-serif" font-size="16">Save and create backup</text>
</svg>
