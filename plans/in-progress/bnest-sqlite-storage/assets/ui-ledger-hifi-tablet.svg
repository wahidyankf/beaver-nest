<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Selected migration ledger storage setup on tablet</title>
  <desc id="desc">A polished tablet ledger puts a safe-to-continue summary above connected migration states and action.</desc>
  <rect width="800" height="900" fill="#F4F6FB"/><rect width="800" height="82" fill="#172033"/><circle cx="50" cy="41" r="21" fill="#5146D8"/><text x="86" y="49" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">Beaver Nest</text>
  <rect x="55" y="112" width="690" height="744" rx="18" fill="#fff" stroke="#D8DDE9"/><text x="96" y="158" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5146D8">STORAGE MOVE</text><text x="96" y="198" font-family="sans-serif" font-size="29" font-weight="750" fill="#172033">Give Bnest a durable home</text>
  <rect x="96" y="230" width="608" height="112" rx="13" fill="#172033"/><text x="122" y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#AFA8FF">SAFE TO CONTINUE</text><text x="122" y="300" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">Nothing is deleted.</text><text x="122" y="326" font-family="sans-serif" font-size="14" fill="#E6E9F1">Private folder · readable source · retryable copy</text>
  <path d="M124 395C95 432 153 468 124 510C95 552 153 589 124 631C97 670 146 706 124 750" fill="none" stroke="#C8C4F6" stroke-width="8" stroke-linecap="round"/>
  <g font-family="sans-serif"><circle cx="124" cy="398" r="14" fill="#5146D8"/><text x="164" y="402" font-size="17" font-weight="700" fill="#172033">Database folder</text><rect x="164" y="422" width="500" height="52" rx="9" fill="#F4F6FB" stroke="#8E96A8"/><text x="183" y="454" font-family="monospace" font-size="15" fill="#172033">~/.config/bnest/</text>
  <circle cx="124" cy="520" r="14" fill="#168B75"/><text x="164" y="526" font-size="17" font-weight="700" fill="#172033">Source inventory ready</text><circle cx="124" cy="590" r="14" fill="#D8DDE9"/><text x="164" y="596" font-size="17" fill="#586174">Copy records</text><circle cx="124" cy="660" r="14" fill="#D8DDE9"/><text x="164" y="666" font-size="17" fill="#586174">Verify and restore</text><circle cx="124" cy="730" r="14" fill="#D8DDE9"/><text x="164" y="736" font-size="17" fill="#586174">Activate SQLite</text></g>
  <rect x="459" y="774" width="205" height="58" rx="10" fill="#5146D8"/><text x="562" y="810" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Move data</text>
</svg>
