<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Quiet card lo-fi storage setup on desktop</title>
  <desc id="desc">A centered compact form asks for a database folder and presents one move-data action.</desc>
  <rect width="1200" height="760" fill="#f2f3f5"/><rect x="60" y="48" width="180" height="28" rx="8" fill="#b8bcc4"/>
  <rect x="310" y="125" width="580" height="520" rx="18" fill="#fff" stroke="#8d929b" stroke-width="3"/>
  <rect x="360" y="180" width="260" height="28" rx="6" fill="#61656d"/><rect x="360" y="226" width="430" height="15" rx="5" fill="#c1c4ca"/>
  <text x="360" y="305" font-family="sans-serif" font-size="18" fill="#42464d">Database folder</text>
  <rect x="360" y="325" width="480" height="58" rx="8" fill="#fff" stroke="#777c85" stroke-width="2"/><text x="380" y="360" font-family="monospace" font-size="17" fill="#555a62">~/.config/bnest/</text>
  <rect x="360" y="410" width="480" height="78" rx="8" fill="#e3e5e8"/><rect x="382" y="435" width="18" height="18" rx="9" fill="#777c85"/><rect x="416" y="437" width="290" height="14" rx="5" fill="#a1a5ad"/>
  <rect x="360" y="520" width="480" height="58" rx="8" fill="#555a62"/><text x="600" y="556" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">Move data</text>
</svg>
