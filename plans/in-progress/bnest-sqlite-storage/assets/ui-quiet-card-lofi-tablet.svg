<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Quiet card lo-fi storage setup on tablet</title>
  <desc id="desc">A single wide card stacks folder input, safety note, and move-data button.</desc>
  <rect width="800" height="900" fill="#f2f3f5"/><rect x="38" y="38" width="160" height="26" rx="8" fill="#b8bcc4"/>
  <rect x="80" y="130" width="640" height="630" rx="18" fill="#fff" stroke="#8d929b" stroke-width="3"/>
  <rect x="130" y="190" width="280" height="30" rx="6" fill="#61656d"/><rect x="130" y="240" width="490" height="15" rx="5" fill="#c1c4ca"/>
  <text x="130" y="330" font-family="sans-serif" font-size="19" fill="#42464d">Database folder</text><rect x="130" y="350" width="540" height="64" rx="8" fill="#fff" stroke="#777c85" stroke-width="2"/>
  <text x="152" y="390" font-family="monospace" font-size="18" fill="#555a62">~/.config/bnest/</text><rect x="130" y="450" width="540" height="100" rx="8" fill="#e3e5e8"/>
  <circle cx="160" cy="485" r="10" fill="#777c85"/><rect x="188" y="478" width="360" height="15" rx="5" fill="#a1a5ad"/><rect x="188" y="510" width="280" height="13" rx="5" fill="#b2b5bb"/>
  <rect x="130" y="610" width="540" height="64" rx="8" fill="#555a62"/><text x="400" y="650" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#fff">Move data</text>
</svg>
