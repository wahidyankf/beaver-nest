<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Source and destination lo-fi storage setup on tablet</title>
  <desc id="desc">Tablet panels stack flat-file source above SQLite destination with a vertical transfer arrow.</desc>
  <rect width="800" height="900" fill="#f2f3f5"/><rect x="38" y="34" width="160" height="26" rx="8" fill="#b8bcc4"/><rect x="80" y="100" width="640" height="730" rx="18" fill="#fff" stroke="#8d929b" stroke-width="3"/>
  <rect x="135" y="155" width="530" height="230" rx="14" fill="#e3e5e8"/><text x="400" y="205" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#42464d">Current flat files</text><rect x="220" y="245" width="360" height="95" rx="8" fill="#fff"/>
  <path d="M400 410V485" stroke="#666b74" stroke-width="8"/><path d="M377 465L400 490 423 465" fill="none" stroke="#666b74" stroke-width="8"/>
  <rect x="135" y="515" width="530" height="200" rx="14" fill="#e3e5e8"/><text x="400" y="560" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#42464d">New SQLite database</text><rect x="220" y="595" width="360" height="75" rx="8" fill="#fff"/>
  <rect x="220" y="750" width="360" height="55" rx="8" fill="#555a62"/>
</svg>
