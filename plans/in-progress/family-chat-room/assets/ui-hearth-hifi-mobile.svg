<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-labelledby="title desc">
  <title id="title">Family hearth high-fidelity mobile concept</title>
  <desc id="desc">An edge-to-edge mobile family chat with a dark sea-green header, compact notification button, chronological warm message bubbles, a new-message affordance, and a safe-area composer.</desc>
  <rect width="393" height="852" fill="#fff9ed"/>
  <rect width="393" height="112" fill="#153f42"/>
  <circle cx="34" cy="43" r="20" fill="#f7b84b"/>
  <path d="M24 46c6-12 15-12 21 0M28 40l-3-7M40 40l3-7" fill="none" stroke="#153f42" stroke-width="3" stroke-linecap="round"/>
  <text x="65" y="39" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="18" font-weight="780">Family chat</text>
  <text x="65" y="64" fill="#80c5b8" font-family="system-ui, sans-serif" font-size="13" font-weight="650"># main · everyone</text>
  <rect x="252" y="25" width="124" height="38" rx="19" fill="#fff9ed"/>
  <circle cx="270" cy="44" r="6" fill="#e5633d"/>
  <text x="282" y="49" fill="#153f42" font-family="system-ui, sans-serif" font-size="12" font-weight="720">Enable alerts</text>
  <rect x="101" y="132" width="191" height="34" rx="17" fill="#d8f1ec"/>
  <text x="122" y="154" fill="#205c5d" font-family="system-ui, sans-serif" font-size="12" font-weight="720">↑ Load older messages</text>
  <text x="178" y="197" fill="#6d7f7e" font-family="system-ui, sans-serif" font-size="11" font-weight="680">TODAY</text>
  <circle cx="28" cy="249" r="17" fill="#80c5b8"/>
  <text x="22" y="255" fill="#153f42" font-family="system-ui, sans-serif" font-size="14" font-weight="800">S</text>
  <rect x="54" y="218" width="274" height="86" rx="7 20 20 20" fill="#ffffff" stroke="#c7ded9" stroke-width="1.5"/>
  <text x="72" y="244" fill="#205c5d" font-family="system-ui, sans-serif" font-size="11" font-weight="760">Sam · 18:03</text>
  <text x="72" y="276" fill="#153f42" font-family="system-ui, sans-serif" font-size="15">Dinner is ready. Come down 🌿</text>
  <rect x="72" y="327" width="285" height="86" rx="20 7 20 20" fill="#205c5d"/>
  <text x="92" y="353" fill="#b9dfd7" font-family="system-ui, sans-serif" font-size="11" font-weight="760">You · 18:04</text>
  <text x="92" y="385" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="15">On my way! Save the crispy bits.</text>
  <circle cx="373" cy="383" r="17" fill="#f7b84b"/>
  <text x="367" y="389" fill="#153f42" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Y</text>
  <circle cx="28" cy="467" r="17" fill="#e5633d"/>
  <text x="22" y="473" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="14" font-weight="800">M</text>
  <rect x="54" y="436" width="256" height="86" rx="7 20 20 20" fill="#ffffff" stroke="#c7ded9" stroke-width="1.5"/>
  <text x="72" y="462" fill="#205c5d" font-family="system-ui, sans-serif" font-size="11" font-weight="760">Mum · 18:05</text>
  <text x="72" y="494" fill="#153f42" font-family="system-ui, sans-serif" font-size="15">Everyone gets a fair share 😊</text>
  <rect x="193" y="619" width="178" height="42" rx="21" fill="#f7b84b"/>
