<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="title desc">
  <title id="title">Family hearth lo-fi tablet</title>
  <desc id="desc">Tablet wireframe for Ruang Keluarga with offline guidance, message delivery states, history control, and bottom composer.</desc>
  <rect width="768" height="1024" fill="#eef1ef"/>
  <rect x="28" y="28" width="712" height="968" rx="26" fill="#fff" stroke="#283433" stroke-width="4"/>
  <rect x="28" y="28" width="712" height="124" rx="26" fill="#d9dfdd" stroke="#283433" stroke-width="4"/>
  <circle cx="76" cy="78" r="22" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="112" y="74" font-family="sans-serif" font-size="21" font-weight="700">Family chat</text>
  <text x="112" y="100" font-family="sans-serif" font-size="15">Ruang Keluarga</text>
  <rect x="550" y="58" width="154" height="42" rx="21" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="573" y="84" font-family="sans-serif" font-size="15">Notifications</text>
  <rect x="66" y="170" width="638" height="38" rx="8" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="88" y="194" font-family="sans-serif" font-size="13" font-weight="700">You’re offline. Messages will send when you reconnect.</text>
  <rect x="276" y="222" width="216" height="36" rx="18" fill="#e5e8e7"/>
  <text x="311" y="245" font-family="sans-serif" font-size="14">Load older messages</text>
  <rect x="66" y="260" width="390" height="82" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="88" y="287" font-family="sans-serif" font-size="13" font-weight="700">Sam · 18:03</text>
  <text x="88" y="319" font-family="sans-serif" font-size="18">Dinner is ready.</text>
  <rect x="314" y="370" width="390" height="82" rx="18" fill="#596362"/>
  <text x="336" y="397" font-family="sans-serif" font-size="13" fill="#fff" font-weight="700">You · 18:04</text>
  <text x="336" y="429" font-family="sans-serif" font-size="18" fill="#fff">On my way!</text>
  <text x="504" y="478" font-family="sans-serif" font-size="13" font-weight="700">Retrying in 4s</text>
  <text x="655" y="478" font-family="sans-serif" font-size="13">Sent</text>
  <rect x="28" y="846" width="712" height="150" fill="#d9dfdd" stroke="#283433" stroke-width="4"/>
  <text x="66" y="882" font-family="sans-serif" font-size="14" font-weight="700">Message the family</text>
  <rect x="66" y="900" width="498" height="60" rx="10" fill="#fff" stroke="#283433" stroke-width="3"/>
  <rect x="582" y="900" width="122" height="60" rx="10" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="620" y="936" font-family="sans-serif" font-size="17" font-weight="700">Send</text>
</svg>
