<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Family hearth high-fidelity desktop concept</title>
  <desc id="desc">A warm desktop Ruang Keluarga chat with offline guidance, queued and sending states, notification control, chronological messages, and an anchored composer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#153f42" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f1ec"/>
      <stop offset="1" stop-color="#b9dfd7"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <circle cx="116" cy="96" r="48" fill="#f7b84b" opacity="0.42"/>
  <circle cx="1326" cy="802" r="76" fill="#e5633d" opacity="0.14"/>
  <text x="72" y="72" fill="#153f42" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">BNEST</text>
  <rect x="270" y="46" width="900" height="808" rx="34" fill="#fff9ed" filter="url(#shadow)"/>
  <rect x="270" y="46" width="900" height="112" rx="34" fill="#153f42"/>
  <rect x="270" y="124" width="900" height="34" fill="#153f42"/>
  <circle cx="328" cy="102" r="28" fill="#f7b84b"/>
  <path d="M314 105c8-17 21-17 29 0M320 98l-4-10M337 98l4-10" fill="none" stroke="#153f42" stroke-width="4" stroke-linecap="round"/>
  <text x="374" y="96" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="24" font-weight="780">Family chat</text>
  <text x="374" y="124" fill="#80c5b8" font-family="system-ui, sans-serif" font-size="15" font-weight="650">Ruang Keluarga · everyone in the family</text>
  <rect x="930" y="78" width="198" height="48" rx="24" fill="#fff9ed"/>
  <circle cx="958" cy="102" r="9" fill="#e5633d"/>
  <text x="979" y="108" fill="#153f42" font-family="system-ui, sans-serif" font-size="15" font-weight="720">Enable alerts</text>
  <rect x="314" y="174" width="812" height="38" rx="12" fill="#fff1cf" stroke="#f7b84b" stroke-width="2"/>
  <text x="338" y="199" fill="#153f42" font-family="system-ui, sans-serif" font-size="14" font-weight="720">You’re offline. Messages will send when you reconnect.</text>
  <rect x="602" y="224" width="236" height="40" rx="20" fill="#d8f1ec"/>
  <path d="M635 244h12m-6-6 6 6-6 6" fill="none" stroke="#205c5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="661" y="249" fill="#205c5d" font-family="system-ui, sans-serif" font-size="14" font-weight="720">Load older messages</text>
  <text x="690" y="278" fill="#6d7f7e" font-family="system-ui, sans-serif" font-size="13" font-weight="680" letter-spacing="0.4">TODAY</text>
  <circle cx="324" cy="313" r="21" fill="#80c5b8"/>
  <text x="316" y="320" fill="#153f42" font-family="system-ui, sans-serif" font-size="18" font-weight="800">S</text>
  <rect x="358" y="282" width="414" height="94" rx="8 24 24 24" fill="#ffffff" stroke="#c7ded9" stroke-width="2"/>
  <text x="382" y="310" fill="#205c5d" font-family="system-ui, sans-serif" font-size="13" font-weight="760">Sam · 18:03</text>
  <text x="382" y="347" fill="#153f42" font-family="system-ui, sans-serif" font-size="18">Dinner is ready. Come downstairs 🌿</text>
  <rect x="654" y="402" width="438" height="94" rx="24 8 24 24" fill="#205c5d"/>
  <text x="680" y="431" fill="#b9dfd7" font-family="system-ui, sans-serif" font-size="13" font-weight="760">You · 18:04</text>
  <text x="680" y="468" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="18">On my way! Save me the crispy bits.</text>
  <circle cx="1116" cy="464" r="21" fill="#f7b84b"/>
  <text x="1108" y="471" fill="#153f42" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Y</text>
  <circle cx="324" cy="555" r="21" fill="#e5633d"/>
  <text x="316" y="562" fill="#fff9ed" font-family="system-ui, sans-serif" font-size="18" font-weight="800">M</text>
  <rect x="358" y="524" width="360" height="94" rx="8 24 24 24" fill="#ffffff" stroke="#c7ded9" stroke-width="2"/>
  <text x="382" y="552" fill="#205c5d" font-family="system-ui, sans-serif" font-size="13" font-weight="760">Mum · 18:05</text>
  <text x="382" y="589" fill="#153f42" font-family="system-ui, sans-serif" font-size="18">Everyone gets a fair share 😊</text>
  <text x="674" y="646" fill="#e5633d" font-family="system-ui, sans-serif" font-size="13" font-weight="760">Waiting for connection</text>
  <text x="856" y="646" fill="#205c5d" font-family="system-ui, sans-serif" font-size="13" font-weight="760">Sending</text>
  <rect x="270" y="686" width="900" height="168" rx="0 0 34 34" fill="#eef8f5"/>
  <line x1="270" y1="686" x2="1170" y2="686" stroke="#c7ded9" stroke-width="2"/>
  <text x="314" y="724" fill="#153f42" font-family="system-ui, sans-serif" font-size="14" font-weight="760">Message the family</text>
  <rect x="314" y="742" width="686" height="72" rx="16" fill="#ffffff" stroke="#80c5b8" stroke-width="2"/>
  <text x="338" y="784" fill="#718886" font-family="system-ui, sans-serif" font-size="16">Write something kind…</text>
  <rect x="1018" y="742" width="110" height="72" rx="16" fill="#e5633d"/>
  <text x="1052" y="785" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Send</text>
