<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-labelledby="title desc">
  <title id="title">Family hearth lo-fi mobile</title>
  <desc id="desc">Mobile Ruang Keluarga wireframe with offline guidance, failed-send action, new-message control, and safe-area composer.</desc>
  <rect width="393" height="852" fill="#fff"/>
  <rect width="393" height="104" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <circle cx="36" cy="42" r="19" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="66" y="39" font-family="sans-serif" font-size="18" font-weight="700">Family chat</text>
  <text x="66" y="63" font-family="sans-serif" font-size="14">Ruang Keluarga</text>
  <rect x="253" y="25" width="120" height="38" rx="19" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="271" y="49" font-family="sans-serif" font-size="13">Notifications</text>
  <rect x="12" y="116" width="369" height="36" rx="8" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="25" y="138" font-family="sans-serif" font-size="11" font-weight="700">You’re offline. Messages will send when you reconnect.</text>
  <rect x="111" y="162" width="171" height="32" rx="16" fill="#e5e8e7"/>
  <text x="135" y="183" font-family="sans-serif" font-size="12">Load older messages</text>
  <rect x="18" y="194" width="280" height="76" rx="17" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="34" y="219" font-family="sans-serif" font-size="12" font-weight="700">Sam · 18:03</text>
  <text x="34" y="248" font-family="sans-serif" font-size="16">Dinner is ready.</text>
  <rect x="95" y="294" width="280" height="76" rx="17" fill="#596362"/>
  <text x="111" y="319" font-family="sans-serif" font-size="12" fill="#fff" font-weight="700">You · 18:04</text>
  <text x="111" y="348" font-family="sans-serif" font-size="16" fill="#fff">On my way!</text>
  <text x="222" y="392" font-family="sans-serif" font-size="12" font-weight="700">Couldn’t send</text>
  <rect x="315" y="376" width="60" height="26" rx="13" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="329" y="394" font-family="sans-serif" font-size="11" font-weight="700">Retry</text>
  <rect x="205" y="640" width="170" height="40" rx="20" fill="#e5e8e7" stroke="#283433" stroke-width="2"/>
  <text x="223" y="665" font-family="sans-serif" font-size="13" font-weight="700">New messages below</text>
  <rect y="700" width="393" height="152" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="18" y="730" font-family="sans-serif" font-size="13" font-weight="700">Message the family</text>
  <rect x="18" y="744" width="268" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="300" y="744" width="75" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="319" y="785" font-family="sans-serif" font-size="15" font-weight="700">Send</text>
</svg>
