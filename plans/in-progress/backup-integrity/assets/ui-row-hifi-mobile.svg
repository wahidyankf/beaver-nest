<title id="ui-row-hifi-mobile-t">Option row, hi-fi, mobile: Backup files item inside the Production database backup row</title>
<desc id="ui-row-hifi-mobile-d">Schedules &amp; backups page at 393 pixels wide, hi-fi mockup of the row alternative, showing the task: the administrator opens the page and learns that two of seven retained backups need attention, 2030-05-14 file missing and 2030-05-16 file changed. All content is synthetic. The Backup files item sits inside the Production database backup row, after Last result: Verified. On mobile the item stacks under Last result. Each state is conveyed by a marker shape and text as well as by any colour. Below the page, a state sheet shows the same Backup files item in six states: checking, all present, needs attention, could not be checked, nothing to check yet, and destination mismatch on the C-DEST branch.</desc>
