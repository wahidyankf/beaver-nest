<svg xmlns="http://www.w3.org/2000/svg" width="393" height="1380" viewBox="0 0 393 1380" role="img" aria-labelledby="ui-banner-lofi-mobile-t ui-banner-lofi-mobile-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
