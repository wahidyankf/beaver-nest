<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1128" viewBox="0 0 768 1128" role="img" aria-labelledby="ui-banner-lofi-tablet-t ui-banner-lofi-tablet-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
