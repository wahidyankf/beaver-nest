<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Selected migration ledger storage setup on mobile</title>
  <desc id="desc">A polished mobile Bnest ledger stacks safety, database folder, migration states, and a full-width Move data button.</desc>
  <rect width="390" height="844" fill="#F4F6FB"/><rect width="390" height="68" fill="#172033"/><circle cx="30" cy="34" r="17" fill="#5146D8"/><text x="58" y="41" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">Beaver Nest</text>
  <text x="22" y="104" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.7" fill="#5146D8">STORAGE MOVE</text><text x="22" y="140" font-family="sans-serif" font-size="25" font-weight="750" fill="#172033">A durable home</text><text x="22" y="165" font-family="sans-serif" font-size="14" fill="#586174">Current data stays until checks pass.</text>
  <rect x="18" y="190" width="354" height="98" rx="13" fill="#172033"/><text x="38" y="221" font-family="sans-serif" font-size="11" font-weight="700" fill="#AFA8FF">SAFE TO CONTINUE</text><text x="38" y="252" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">Nothing is deleted.</text><text x="38" y="274" font-family="sans-serif" font-size="12" fill="#E6E9F1">Private folder · readable source · retryable</text>
  <path d="M43 334C20 370 66 403 43 442C20 481 66 516 43 555C22 591 62 625 43 663" fill="none" stroke="#C8C4F6" stroke-width="7" stroke-linecap="round"/>
  <g font-family="sans-serif"><circle cx="43" cy="337" r="12" fill="#5146D8"/><text x="75" y="341" font-size="16" font-weight="700" fill="#172033">Database folder</text><rect x="75" y="358" width="278" height="58" rx="9" fill="#fff" stroke="#8E96A8"/><text x="89" y="392" font-family="monospace" font-size="13" fill="#172033">~/.config/bnest/</text>
  <circle cx="43" cy="453" r="12" fill="#168B75"/><text x="75" y="459" font-size="16" font-weight="700" fill="#172033">Source inventory ready</text><circle cx="43" cy="521" r="12" fill="#D8DDE9"/><text x="75" y="527" font-size="16" fill="#586174">Copy records</text><circle cx="43" cy="589" r="12" fill="#D8DDE9"/><text x="75" y="595" font-size="16" fill="#586174">Verify and restore</text><circle cx="43" cy="657" r="12" fill="#D8DDE9"/><text x="75" y="663" font-size="16" fill="#586174">Activate SQLite</text></g>
  <rect x="18" y="720" width="354" height="60" rx="10" fill="#5146D8"/><text x="195" y="758" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Move data</text><text x="195" y="810" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#586174">Usually finishes in under a minute.</text>
</svg>
