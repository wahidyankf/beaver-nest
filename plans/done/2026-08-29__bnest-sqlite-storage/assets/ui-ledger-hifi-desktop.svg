<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Selected migration ledger storage setup on desktop</title>
  <desc id="desc">A polished Bnest desktop ledger shows the default database folder, five migration states, safety summary, and Move data action.</desc>
  <rect width="1200" height="760" fill="#F4F6FB"/><path d="M0 0H1200V92H0Z" fill="#172033"/><circle cx="70" cy="46" r="24" fill="#5146D8"/><path d="M59 49Q70 30 81 49Q70 64 59 49Z" fill="#F4F6FB"/><text x="112" y="54" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">Beaver Nest</text>
  <rect x="70" y="126" width="705" height="570" rx="18" fill="#fff" stroke="#D8DDE9"/><rect x="815" y="126" width="315" height="390" rx="18" fill="#172033"/>
  <text x="118" y="174" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5146D8">STORAGE MOVE</text><text x="118" y="216" font-family="sans-serif" font-size="30" font-weight="750" fill="#172033">Give Bnest a durable home</text><text x="118" y="246" font-family="sans-serif" font-size="16" fill="#586174">Your current data stays in place until every check passes.</text>
  <path d="M151 306C123 344 178 376 150 418C121 460 178 493 150 535C126 570 165 602 151 637" fill="none" stroke="#C8C4F6" stroke-width="8" stroke-linecap="round"/>
  <g font-family="sans-serif"><circle cx="151" cy="310" r="15" fill="#5146D8"/><text x="192" y="309" font-size="17" font-weight="700" fill="#172033">Database folder</text><text x="192" y="333" font-size="14" fill="#586174">This folder is on the Bnest computer.</text>
  <rect x="192" y="348" width="515" height="52" rx="9" fill="#F4F6FB" stroke="#8E96A8"/><text x="210" y="380" font-family="monospace" font-size="15" fill="#172033">~/.config/bnest/</text><text x="655" y="380" font-size="14" fill="#5146D8">Edit</text>
  <circle cx="151" cy="431" r="15" fill="#168B75"/><text x="192" y="437" font-size="17" font-weight="700" fill="#172033">Source inventory ready</text><circle cx="151" cy="493" r="15" fill="#D8DDE9"/><text x="192" y="499" font-size="17" fill="#586174">Copy records</text><circle cx="151" cy="555" r="15" fill="#D8DDE9"/><text x="192" y="561" font-size="17" fill="#586174">Verify and restore</text><circle cx="151" cy="617" r="15" fill="#D8DDE9"/><text x="192" y="623" font-size="17" fill="#586174">Activate SQLite</text></g>
  <text x="852" y="176" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#AFA8FF">SAFE TO CONTINUE</text><text x="852" y="220" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">Nothing is deleted.</text>
  <g font-family="sans-serif" font-size="15" fill="#E6E9F1"><text x="852" y="270">✓ Private server folder</text><text x="852" y="304">✓ Current data remains readable</text><text x="852" y="338">✓ Retry keeps accepted copies</text></g>
  <rect x="852" y="382" width="241" height="60" rx="10" fill="#5146D8"/><text x="973" y="419" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Move data</text><text x="852" y="474" font-family="sans-serif" font-size="13" fill="#AEB6C7">Usually finishes in under a minute.</text>
</svg>
