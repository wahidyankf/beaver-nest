<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Channel rail lo-fi desktop</title>
  <desc id="desc">Rejected desktop wireframe with a persistent left channel rail and the family conversation occupying the right side.</desc>
  <rect width="1200" height="760" fill="#eef1ef"/>
  <rect x="90" y="40" width="1020" height="680" rx="22" fill="#fff" stroke="#283433" stroke-width="4"/>
  <rect x="90" y="40" width="250" height="680" rx="22" fill="#d9dfdd" stroke="#283433" stroke-width="4"/>
  <text x="126" y="92" font-family="sans-serif" font-size="24" font-weight="700">Family chat</text>
  <text x="126" y="142" font-family="sans-serif" font-size="15" font-weight="700">Channels</text>
  <rect x="116" y="164" width="198" height="54" rx="12" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="140" y="198" font-family="sans-serif" font-size="18"># Main</text>
  <text x="378" y="88" font-family="sans-serif" font-size="24" font-weight="700">Main</text>
  <rect x="890" y="60" width="174" height="42" rx="21" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="918" y="86" font-family="sans-serif" font-size="15">Notifications</text>
  <line x1="340" y1="122" x2="1110" y2="122" stroke="#283433" stroke-width="3"/>
  <rect x="382" y="174" width="344" height="74" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="402" y="202" font-family="sans-serif" font-size="14" font-weight="700">Sam · 18:03</text>
  <text x="402" y="229" font-family="sans-serif" font-size="17">Dinner is ready.</text>
  <rect x="720" y="274" width="344" height="74" rx="18" fill="#596362"/>
  <text x="740" y="302" font-family="sans-serif" font-size="14" fill="#fff" font-weight="700">You · 18:04</text>
  <text x="740" y="329" font-family="sans-serif" font-size="17" fill="#fff">On my way!</text>
  <line x1="340" y1="580" x2="1110" y2="580" stroke="#283433" stroke-width="3"/>
  <rect x="378" y="614" width="520" height="62" rx="10" fill="#fff" stroke="#283433" stroke-width="3"/>
  <rect x="918" y="614" width="146" height="62" rx="10" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="968" y="652" font-family="sans-serif" font-size="17" font-weight="700">Send</text>
</svg>
