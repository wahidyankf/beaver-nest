<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="door-lofi-tablet-title door-lofi-tablet-desc" data-plan-artifact="true">
  <title id="door-lofi-tablet-title">Front Door tablet lo-fi wireframe</title><desc id="door-lofi-tablet-desc">A grayscale tablet setup centered on one progressive account form with explanation above it.</desc>
  <rect width="768" height="1024" fill="#eee"/><rect x="38" y="28" width="692" height="968" rx="28" fill="#fff" stroke="#333" stroke-width="3"/>
  <rect x="38" y="28" width="692" height="238" rx="28" fill="#ddd"/><text x="82" y="88" font-family="Arial" font-size="28" font-weight="700">WELCOME HOME</text><text x="82" y="128" font-family="Arial" font-size="16">Create private family access once.</text><text x="82" y="177" font-family="Arial" font-size="14">Add members → assign roles → review and close setup</text><text x="82" y="218" font-family="Arial" font-size="14">No public registration will remain.</text>
  <text x="110" y="326" font-family="Arial" font-size="14">STEP 1 OF 3</text><text x="110" y="370" font-family="Arial" font-size="24" font-weight="700">Add the first administrator</text>
  <g font-family="Arial" font-size="15"><text x="110" y="424">Username</text><rect x="110" y="440" width="548" height="56" rx="10" fill="#fff" stroke="#555"/><text x="130" y="475" fill="#555">test-user-parent</text><text x="110" y="540">Password</text><rect x="110" y="556" width="548" height="56" rx="10" fill="#fff" stroke="#555"/><text x="130" y="591">••••••••••••</text><text x="110" y="656">Roles</text><rect x="110" y="674" width="138" height="44" rx="22" fill="#fff" stroke="#555"/><text x="145" y="702">parents</text><rect x="264" y="674" width="120" height="44" rx="22" fill="#222"/><text x="299" y="702" fill="#fff">✓ admin</text></g>
  <rect x="448" y="794" width="210" height="54" rx="11" fill="#222"/><text x="501" y="828" fill="#fff" font-family="Arial" font-size="16">Continue</text><text x="110" y="912" font-family="Arial" font-size="13">A family summary is shown only during final review.</text>
</svg>
