<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-labelledby="title desc">
  <title id="title">Quote card lo-fi mobile</title>
  <desc id="desc">Mobile Ruang Keluarga wireframe showing a reply whose quoted message sits in a bordered card inside the bubble, an action sheet raised from the bottom edge with Reply and Copy text, and a composer reply strip above the message input.</desc>
  <rect width="393" height="852" fill="#fff"/>
  <rect width="393" height="104" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <circle cx="36" cy="42" r="19" fill="#fff" stroke="#283433" stroke-width="3"/>
  <text x="66" y="39" font-family="sans-serif" font-size="18" font-weight="700">Family chat</text>
  <text x="66" y="63" font-family="sans-serif" font-size="14">Ruang Keluarga</text>

  <rect x="18" y="126" width="290" height="76" rx="17" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="34" y="151" font-family="sans-serif" font-size="12" font-weight="700">Ayah · 16:02</text>
  <text x="34" y="180" font-family="sans-serif" font-size="16">Nanti aku jemput jam 5</text>

  <rect x="18" y="214" width="290" height="60" rx="17" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="34" y="239" font-family="sans-serif" font-size="12" font-weight="700">Kakak · 16:03</text>
  <text x="34" y="262" font-family="sans-serif" font-size="15">Aku pulang sendiri aja</text>

  <rect x="85" y="288" width="290" height="126" rx="17" fill="#596362"/>
  <text x="101" y="313" font-family="sans-serif" font-size="12" fill="#fff" font-weight="700">Bunda · 16:05</text>
  <rect x="101" y="324" width="258" height="50" rx="9" fill="#fff" stroke="#c9cfce" stroke-width="2"/>
  <rect x="101" y="324" width="6" height="50" rx="3" fill="#283433"/>
  <text x="117" y="343" font-family="sans-serif" font-size="11" font-weight="700">↩ Ayah</text>
  <text x="117" y="364" font-family="sans-serif" font-size="12">Nanti aku jemput jam 5</text>
  <text x="101" y="398" font-family="sans-serif" font-size="16" fill="#fff">Oke, aku siapin</text>
  <text x="101" y="432" font-family="sans-serif" font-size="11" font-weight="700">Quote card is a button: tap jumps to the original</text>

  <rect x="0" y="560" width="393" height="176" rx="20" fill="#fff" stroke="#283433" stroke-width="3"/>
  <rect x="163" y="574" width="67" height="6" rx="3" fill="#596362"/>
  <text x="24" y="612" font-family="sans-serif" font-size="12" font-weight="700">Message actions</text>
  <rect x="16" y="622" width="361" height="50" rx="10" fill="#e5e8e7" stroke="#283433" stroke-width="2"/>
  <text x="34" y="653" font-family="sans-serif" font-size="16" font-weight="700">↩  Reply</text>
  <rect x="16" y="678" width="361" height="50" rx="10" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="34" y="709" font-family="sans-serif" font-size="16">❐  Copy text</text>

  <rect y="736" width="393" height="116" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <rect x="14" y="746" width="365" height="34" rx="8" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="14" y="746" width="6" height="34" rx="3" fill="#283433"/>
  <text x="30" y="762" font-family="sans-serif" font-size="10" font-weight="700">Replying to Ayah</text>
  <text x="30" y="775" font-family="sans-serif" font-size="11">Nanti aku jemput jam 5</text>
  <rect x="345" y="752" width="24" height="22" rx="6" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="352" y="768" font-family="sans-serif" font-size="12" font-weight="700">×</text>
  <rect x="14" y="788" width="272" height="50" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="298" y="788" width="81" height="50" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="318" y="819" font-family="sans-serif" font-size="15" font-weight="700">Send</text>
</svg>
