<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Quote card high-fidelity desktop concept</title>
  <desc id="desc">Desktop Ruang Keluarga in the Beaver Nest palette: a focused message showing its actions control and keyboard hint, the action menu opened beside it, a reply carrying its quote in a lagoon card with a sun accent bar, a disabled Reply state on an unsent message, and a composer reply strip.</desc>
