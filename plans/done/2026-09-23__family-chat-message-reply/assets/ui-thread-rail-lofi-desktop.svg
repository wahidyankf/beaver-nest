<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Thread rail lo-fi desktop</title>
  <desc id="desc">Rejected desktop alternative: replies are indented under their parent behind a connector rail with a collapse control, and a side panel lists threads, which introduces a second navigation model the single family room does not need.</desc>
  <rect width="1440" height="900" fill="#fff"/>
  <rect width="1440" height="96" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="48" y="46" font-family="sans-serif" font-size="20" font-weight="700">Family chat</text>
  <text x="48" y="72" font-family="sans-serif" font-size="15">Ruang Keluarga</text>

  <rect x="1040" y="96" width="400" height="804" fill="#f2f3f3" stroke="#283433" stroke-width="3"/>
  <text x="1068" y="140" font-family="sans-serif" font-size="15" font-weight="700">Threads</text>
  <rect x="1068" y="156" width="344" height="62" rx="10" fill="#fff" stroke="#596362" stroke-width="2"/>
  <text x="1086" y="180" font-family="sans-serif" font-size="12" font-weight="700">Ayah · pickup</text>
  <text x="1086" y="202" font-family="sans-serif" font-size="12">2 replies</text>
  <text x="1068" y="248" font-family="sans-serif" font-size="11" font-weight="700">A second place to look for the same messages</text>

  <rect x="120" y="150" width="620" height="84" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="144" y="178" font-family="sans-serif" font-size="13" font-weight="700">Ayah · 16:02</text>
  <text x="144" y="210" font-family="sans-serif" font-size="17">Nanti aku jemput jam 5</text>

  <path d="M148 234 V 296 H 190" fill="none" stroke="#283433" stroke-width="3"/>
  <rect x="190" y="262" width="620" height="76" rx="18" fill="#596362"/>
  <text x="214" y="290" font-family="sans-serif" font-size="13" fill="#fff" font-weight="700">Bunda · 16:05</text>
  <text x="214" y="322" font-family="sans-serif" font-size="17" fill="#fff">Oke, aku siapin</text>

  <path d="M148 338 V 400 H 190" fill="none" stroke="#283433" stroke-width="3"/>
  <rect x="190" y="366" width="620" height="76" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="214" y="394" font-family="sans-serif" font-size="13" font-weight="700">Adik · 16:11</text>
  <text x="214" y="426" font-family="sans-serif" font-size="17">Aku ikut ya</text>

  <rect x="190" y="456" width="220" height="36" rx="18" fill="#e5e8e7" stroke="#283433" stroke-width="2"/>
  <text x="212" y="480" font-family="sans-serif" font-size="13" font-weight="700">Collapse 2 replies</text>

  <rect x="120" y="512" width="620" height="66" rx="18" fill="#f2f3f3" stroke="#596362" stroke-width="2"/>
  <text x="144" y="539" font-family="sans-serif" font-size="13" font-weight="700">Kakak · 16:03</text>
  <text x="144" y="564" font-family="sans-serif" font-size="16">Aku pulang sendiri aja</text>
  <text x="120" y="606" font-family="sans-serif" font-size="12" font-weight="700">Indentation depth grows without bound as replies chain</text>

  <rect y="764" width="1040" height="136" fill="#d9dfdd" stroke="#283433" stroke-width="3"/>
  <text x="120" y="794" font-family="sans-serif" font-size="13" font-weight="700">Replying in Ayah's thread    ×</text>
  <rect x="120" y="806" width="700" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <rect x="838" y="806" width="114" height="70" rx="10" fill="#fff" stroke="#283433" stroke-width="2"/>
  <text x="868" y="847" font-family="sans-serif" font-size="16" font-weight="700">Send</text>
</svg>
