<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="ledger-lofi-desktop-title ledger-lofi-desktop-desc">
  <title id="ledger-lofi-desktop-title">Household Ledger desktop lo-fi wireframe</title><desc id="ledger-lofi-desktop-desc">A grayscale desktop administrator ledger with editable account rows, role columns, status, and a review rail.</desc>
  <rect width="1440" height="900" fill="#eee"/><rect x="54" y="46" width="1332" height="808" rx="20" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="96" y="105" font-family="Arial" font-size="28" font-weight="700">HOUSEHOLD ACCOUNT LEDGER</text><text x="96" y="143" font-family="Arial" font-size="16">Configure all accounts, then review and close setup.</text>
  <rect x="96" y="190" width="990" height="552" rx="14" fill="#fafafa" stroke="#333"/><g font-family="Arial" font-size="14"><text x="122" y="232" font-weight="700">USERNAME</text><text x="418" y="232" font-weight="700">ROLES</text><text x="674" y="232" font-weight="700">PASSWORD</text><text x="890" y="232" font-weight="700">STATUS</text><line x1="96" y1="250" x2="1086" y2="250" stroke="#333"/>
  <rect x="116" y="276" width="270" height="48" rx="7" fill="#fff" stroke="#555"/><text x="136" y="306">test-user-parent</text><rect x="418" y="280" width="98" height="40" rx="20" fill="#ddd"/><text x="440" y="305">parents</text><rect x="526" y="280" width="84" height="40" rx="20" fill="#ddd"/><text x="551" y="305">admin</text><text x="674" y="305">••••••••••</text><text x="890" y="305">✓ Ready</text>
  <line x1="116" y1="350" x2="1058" y2="350" stroke="#aaa"/><rect x="116" y="376" width="270" height="48" rx="7" fill="#fff" stroke="#555"/><text x="136" y="406">test-user-child</text><rect x="418" y="380" width="104" height="40" rx="20" fill="#222"/><text x="439" y="405" fill="#fff">children</text><text x="674" y="405">Add password</text><text x="890" y="405">Needs input</text>
  <line x1="116" y1="450" x2="1058" y2="450" stroke="#aaa"/><rect x="116" y="478" width="270" height="48" rx="7" fill="#fff" stroke="#555" stroke-dasharray="7 5"/><text x="136" y="508">New username</text><text x="418" y="508">Choose roles</text><text x="674" y="508">Add password</text><text x="890" y="508">Draft</text></g>
  <rect x="116" y="574" width="190" height="46" rx="10" fill="#fff" stroke="#333"/><text x="145" y="603" font-family="Arial" font-size="15">+ Add account row</text><rect x="836" y="660" width="222" height="54" rx="12" fill="#222"/><text x="884" y="694" fill="#fff" font-family="Arial" font-size="16">Review accounts</text>
  <rect x="1122" y="190" width="222" height="552" rx="14" fill="#e5e5e5" stroke="#555"/><text x="1150" y="232" font-family="Arial" font-size="20" font-weight="700">Setup checks</text><g font-family="Arial" font-size="14"><text x="1150" y="286">✓ 2 accounts</text><text x="1150" y="326">✓ 1 administrator</text><text x="1150" y="366">! 1 missing password</text><text x="1150" y="430">Setup closes forever</text><text x="1150" y="455">after confirmation.</text></g>
</svg>
