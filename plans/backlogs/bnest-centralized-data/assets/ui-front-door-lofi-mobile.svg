<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="door-lofi-mobile-title door-lofi-mobile-desc">
  <title id="door-lofi-mobile-title">Front Door mobile lo-fi wireframe</title><desc id="door-lofi-mobile-desc">A grayscale mobile setup containing a concise explanation and one progressive administrator account form.</desc>
  <rect width="375" height="812" fill="#eee"/><rect x="13" y="13" width="349" height="786" rx="24" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="13" y="13" width="349" height="166" rx="24" fill="#ddd"/><text x="35" y="55" font-family="Arial" font-size="21" font-weight="700">WELCOME HOME</text><text x="35" y="84" font-family="Arial" font-size="13">Create private family access once.</text><text x="35" y="120" font-family="Arial" font-size="12">1 Add · 2 Review · 3 Close</text><text x="35" y="148" font-family="Arial" font-size="12">No public registration afterward.</text>
  <text x="34" y="221" font-family="Arial" font-size="12">STEP 1 OF 3</text><text x="34" y="254" font-family="Arial" font-size="19" font-weight="700">First administrator</text>
  <g font-family="Arial" font-size="13"><text x="34" y="296">Username</text><rect x="34" y="310" width="307" height="50" rx="9" fill="#fff" stroke="#555"/><text x="50" y="341" fill="#555">test-user-parent</text><text x="34" y="400">Password</text><rect x="34" y="414" width="307" height="50" rx="9" fill="#fff" stroke="#555"/><text x="50" y="445">••••••••••••</text><text x="34" y="504">Roles</text><rect x="34" y="520" width="124" height="42" rx="21" fill="#fff" stroke="#555"/><text x="64" y="546">parents</text><rect x="170" y="520" width="112" height="42" rx="21" fill="#222"/><text x="202" y="546" fill="#fff">✓ admin</text></g>
  <rect x="34" y="620" width="307" height="52" rx="11" fill="#222"/><text x="150" y="653" fill="#fff" font-family="Arial" font-size="15">Continue</text><text x="34" y="724" font-family="Arial" font-size="12">Summary appears at final review.</text>
</svg>
