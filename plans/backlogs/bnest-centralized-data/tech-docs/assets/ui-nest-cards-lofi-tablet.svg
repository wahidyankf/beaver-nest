<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="nest-lofi-tablet-title nest-lofi-tablet-desc" data-plan-artifact="true">
  <title id="nest-lofi-tablet-title">Nest Cards tablet lo-fi wireframe</title><desc id="nest-lofi-tablet-desc">A grayscale tablet setup with a compact stepper, account form, and horizontal family summary.</desc>
