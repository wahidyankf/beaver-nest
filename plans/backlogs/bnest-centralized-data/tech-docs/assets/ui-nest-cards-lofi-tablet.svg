  <g font-family="Arial" font-size="15"><text x="104" y="330">Username</text><rect x="104" y="346" width="528" height="54" rx="10" fill="#fff" stroke="#555"/><text x="124" y="380" fill="#555">test-user-child</text><text x="104" y="442">Password</text><rect x="104" y="458" width="528" height="54" rx="10" fill="#fff" stroke="#555"/><text x="124" y="492">••••••••••••</text><text x="104" y="554">Roles</text><rect x="104" y="574" width="150" height="46" rx="23" fill="#222"/><text x="137" y="603" fill="#fff">✓ children</text><rect x="268" y="574" width="136" height="46" rx="23" fill="#fff" stroke="#555"/><text x="301" y="603">parents</text><rect x="418" y="574" width="122" height="46" rx="23" fill="#fff" stroke="#555"/><text x="455" y="603">admin</text></g><rect x="462" y="646" width="170" height="42" rx="11" fill="#222"/><text x="505" y="673" fill="#fff" font-family="Arial">Save account</text>
