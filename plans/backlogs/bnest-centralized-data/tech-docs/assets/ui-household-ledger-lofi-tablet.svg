  <rect x="62" y="590" width="644" height="216" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="88" y="628" font-weight="700">test-user-child</text><text x="88" y="666">Roles</text><rect x="142" y="647" width="104" height="36" rx="18" fill="#222"/><text x="163" y="670" fill="#fff">children</text><text x="88" y="724">Password</text><rect x="170" y="694" width="510" height="48" rx="8" fill="#fff" stroke="#555"/><text x="190" y="724">••••••••••</text><text x="88" y="772">Needs review</text></g>
