<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="nest-lofi-desktop-title nest-lofi-desktop-desc" data-plan-artifact="true">
  <title id="nest-lofi-desktop-title">Nest Cards desktop lo-fi wireframe</title>
  <desc id="nest-lofi-desktop-desc">A grayscale desktop setup with three progress steps, an active account form, and a family account summary.</desc>
  <rect width="1440" height="900" fill="#f3f3f3"/><rect x="72" y="56" width="1296" height="788" rx="28" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="120" y="118" font-family="Arial" font-size="28" font-weight="700">BNEST / INITIAL SETUP</text><text x="120" y="160" font-family="Arial" font-size="18">Create your family accounts once. Setup closes after confirmation.</text>
  <g font-family="Arial" font-size="16"><rect x="120" y="204" width="338" height="54" rx="14" fill="#222"/><text x="148" y="238" fill="#fff">1  Add family members</text><rect x="476" y="204" width="338" height="54" rx="14" fill="#ddd" stroke="#555"/><text x="504" y="238">2  Review roles</text><rect x="832" y="204" width="338" height="54" rx="14" fill="#ddd" stroke="#555"/><text x="860" y="238">3  Close setup</text></g>
  <rect x="120" y="302" width="754" height="472" rx="24" fill="#fafafa" stroke="#333" stroke-width="3"/><text x="164" y="356" font-family="Arial" font-size="24" font-weight="700">Account 2 of 3</text>
  <g font-family="Arial" font-size="15"><text x="164" y="404">Username</text><rect x="164" y="420" width="666" height="56" rx="10" fill="#fff" stroke="#555"/><text x="184" y="455" fill="#555">test-user-child</text><text x="164" y="516">Password</text><rect x="164" y="532" width="666" height="56" rx="10" fill="#fff" stroke="#555"/><text x="184" y="567" fill="#555">••••••••••••</text><text x="164" y="628">Roles (choose one or more)</text><rect x="164" y="648" width="156" height="48" rx="24" fill="#222"/><text x="199" y="678" fill="#fff">✓ children</text><rect x="336" y="648" width="142" height="48" rx="24" fill="#fff" stroke="#555"/><text x="369" y="678">parents</text><rect x="494" y="648" width="126" height="48" rx="24" fill="#fff" stroke="#555"/><text x="533" y="678">admin</text></g>
  <rect x="652" y="714" width="178" height="44" rx="12" fill="#222"/><text x="698" y="743" fill="#fff" font-family="Arial" font-size="16">Save account</text>
  <rect x="914" y="302" width="390" height="472" rx="24" fill="#eee" stroke="#555" stroke-width="2"/><text x="950" y="354" font-family="Arial" font-size="22" font-weight="700">Your family nest</text>
  <g font-family="Arial" font-size="16"><rect x="950" y="390" width="318" height="80" rx="16" fill="#fff" stroke="#555"/><text x="978" y="423" font-weight="700">test-user-parent</text><text x="978" y="451">parents · admin  ✓</text><rect x="950" y="488" width="318" height="80" rx="16" fill="#fff" stroke="#555" stroke-dasharray="8 6"/><text x="978" y="522" font-weight="700">Account in progress</text><text x="978" y="550">children</text><rect x="950" y="586" width="318" height="80" rx="16" fill="#fff" stroke="#555" stroke-dasharray="8 6"/><text x="978" y="632">+ Add another account</text></g>
</svg>
