<rect x="144" y="731.6" width="1152" height="58" rx="6" fill="#fafafa" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160" y="756.2" font-size="16" font-weight="700" fill="#1b1b1b">Production database backup</text>
<text x="160" y="776.15" font-size="13" fill="#555555">Schedule form with Enabled, Daily time (WIB) and Save schedule (unchanged)</text>
<rect x="144" y="813.6" width="1152" height="58" rx="6" fill="#fafafa" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160" y="838.2" font-size="16" font-weight="700" fill="#1b1b1b">Backup folder</text>
<text x="160" y="858.15" font-size="13" fill="#555555">Folder form with Save and create first backup (unchanged)</text>
<rect x="16" y="935.6" width="1408" height="122" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="32" y="963.15" font-size="13" font-weight="800" fill="#1b1b1b">Notes for this alternative</text>
<text x="32" y="988.15" font-size="13" fill="#1b1b1b">Placement: a status banner between the page title and Family schedules, rendered only when something needs attention or the check failed.</text>
<text x="32" y="1012.15" font-size="13" fill="#1b1b1b">Silent when all retained backups are present, while checking and when there is nothing to check: no positive assurance.</text>
<text x="32" y="1036.15" font-size="13" fill="#1b1b1b">Drawbacks: pushes every schedule down when it appears, which moves content the administrator may be reading.</text>
</svg>
