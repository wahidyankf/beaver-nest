<path d="M180.2 217.8 L180.2 223.3" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180.2" cy="226" r="1.2" fill="#1b1b1b"/>
<text x="197.2" y="226.4" font-size="16" font-weight="700" fill="#1b1b1b" xml:space="preserve"><tspan font-weight="700">2 of 7 retained backups need attention</tspan></text>
<text x="197.2" y="254.4" font-size="16" fill="#1b1b1b" xml:space="preserve"><tspan>2030-05-14: </tspan><tspan font-weight="800">file missing</tspan></text>
<text x="197.2" y="278.4" font-size="16" fill="#1b1b1b" xml:space="preserve"><tspan>2030-05-16: </tspan><tspan font-weight="800">file changed</tspan></text>
<rect x="1240" y="179" width="48" height="18" rx="2" fill="#000000"/>
<text x="1264" y="191.85" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1" fill="#ffffff">NEW</text>
<text x="144" y="347.2" font-size="16" font-weight="700" fill="#1b1b1b">Family schedules</text>
<text x="144" y="387.2" font-size="16" fill="#1b1b1b">No family schedules are configured.</text>
<text x="144" y="435.2" font-size="16" font-weight="700" fill="#1b1b1b">Admin/system schedules</text>
<rect x="144" y="457.6" width="1152" height="176" rx="6" fill="#fafafa" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="166" y="497.2" font-size="16" font-weight="700" fill="#1b1b1b">Production database backup</text>
<text x="166" y="528.8" font-size="12" font-weight="800" fill="#1b1b1b">CADENCE</text>
<text x="166" y="551.2" font-size="16" fill="#1b1b1b">Daily at 02:00 WIB</text>
<text x="446" y="528.8" font-size="12" font-weight="800" fill="#1b1b1b">NEXT RUN</text>
<text x="446" y="551.2" font-size="16" fill="#1b1b1b">2030-05-18 19:00:00Z</text>
<text x="726" y="528.8" font-size="12" font-weight="800" fill="#1b1b1b">STATE</text>
<text x="726" y="551.2" font-size="16" fill="#1b1b1b">Enabled</text>
<text x="1006" y="528.8" font-size="12" font-weight="800" fill="#1b1b1b">EXPIRATION</text>
<text x="1006" y="551.2" font-size="16" fill="#1b1b1b">Never expires</text>
<text x="166" y="582.8" font-size="12" font-weight="800" fill="#1b1b1b">LAST RESULT</text>
<text x="166" y="605.2" font-size="16" fill="#1b1b1b">Verified</text>
<rect x="144" y="649.6" width="1152" height="58" rx="6" fill="#fafafa" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4"/>
