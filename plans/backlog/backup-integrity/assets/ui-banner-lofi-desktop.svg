<text x="144" y="85.6" font-size="16" fill="#1b1b1b" xml:space="preserve"><tspan>Admin home</tspan><tspan> / </tspan><tspan>Admin settings</tspan></text>
<text x="144" y="141.6" font-size="16" font-weight="800" letter-spacing="1.92" fill="#1b1b1b">DAILY OPERATIONS</text>
<text x="144" y="165.6" font-size="16" font-weight="700" fill="#1b1b1b">Schedules &amp; backups</text>
