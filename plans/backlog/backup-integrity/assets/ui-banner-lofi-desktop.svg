<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1074" viewBox="0 0 1440 1074" role="img" aria-labelledby="ui-banner-lofi-desktop-t ui-banner-lofi-desktop-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="ui-banner-lofi-desktop-t">Option banner, lo-fi, desktop: status banner above the schedule groups</title>
<desc id="ui-banner-lofi-desktop-d">Schedules &amp; backups page at 1440 pixels wide, lo-fi wireframe of the banner alternative, showing the task: the administrator opens the page and learns that two of seven retained backups need attention, 2030-05-14 file missing and 2030-05-16 file changed. All content is synthetic. A status banner sits between the page title and Family schedules. On desktop the banner spans the full content width. Each state is conveyed by a marker shape and text as well as by any colour. </desc>
