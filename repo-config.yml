# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.12.0/schemas/repo-config/v2.schema.json
# Beaver-Nest consumer policy for the immutable Rhino v0.4.0 release.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - coverage
    - playwright-report
    - test-results
    - worktrees
    - deps

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
      dispatches: dispatches
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
      - inline-result-only
      - single-mcp-operation
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        dispatches: { field: tools, format: "Agent({names})" }
        empty-tier: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: requires,
              capability: network,
              field: tools,
              members: [WebSearch, WebFetch],
            }
          - {
              when: constrains,
              capability: read-only,
              field: tools,
              absent-members: [Write, Edit],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        ultra: {}
        plan: {}
        execution: { model: sonnet, effort: xhigh }
        fast: { model: haiku, effort: xhigh }
    - id: codex
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: model_reasoning_effort }
      tiers:
        ultra: {}
        plan: {}
        execution: {}
        fast:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-luna
            fallback: gpt-6-luna
          effort: xhigh
    - id: opencode
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        dispatches: { field: permission.task, format: allow-map }
        translations:
          # Deny by default; each granted capability below re-allows its entry.
          - {
              when: always,
              field: permission,
              entries:
                {
                  read: allow,
                  edit: deny,
                  bash: deny,
                  webfetch: deny,
                  websearch: deny,
                },
            }
          - { when: no-dispatches, field: permission, entries: { task: deny } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: requires,
              capability: network,
              field: permission,
              entries: { webfetch: allow, websearch: allow },
            }
    - id: commandcode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
          - single-mcp-operation
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".commandcode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: |-
          Before acting, read the complete canonical agent definition at the repository-root path
          {path} and follow it as authoritative.
          If it cannot be read, stop and report the missing path.
        identity:
          name: name
          description: description
        agents:
          - ci-checker
          - ci-fixer
          - ci-monitor-subagent
          - docs-checker
          - docs-fixer
          - harness-checker
          - harness-fixer
          - plan-checker
          - plan-execution-checker
          - plan-fixer
          - plan-maker
          - pr-review-checker
          - pr-review-fixer
          - rules-checker
          - rules-fixer
          - specs-checker
          - specs-fixer
          - swe-api-tester
          - swe-architect
          - swe-debugger
          - swe-developer
          - swe-infra-tester
          - swe-releaser
          - swe-reviewer
          - swe-usability-tester
          - swe-web-tester
          - web-researcher
        absent:
          - model
          - featureModels
          - effort
          - reasoningEffort
        translations:
          - when: always
            field: tools
            members:
              - read_file
          - when: always
            field: disallowedTools
            members:
              - agent
              - agent_output
          - when: requires
            capability: repository-read
            field: tools
            members:
              - read_directory
              - grep
              - glob
          - when: requires
            capability: repository-write
            field: tools
            members:
              - write_file
              - edit_file
          - when: requires
            capability: shell
            field: tools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: requires
            capability: network
            field: tools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: constrains
            capability: inline-result-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: repository-read
            field: disallowedTools
            members:
              - read_file
              - read_directory
              - grep
              - glob
          - when: denies
            capability: repository-write
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: shell
            field: disallowedTools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: denies
            capability: network
            field: disallowedTools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: single-mcp-operation
            field: tools
            members:
              - mcp__nx-mcp__ci_information
              - mcp__nx-mcp__update_self_healing_fix
          - when: constrains
            capability: single-mcp-operation
            field: tools
            absent-members:
              - web_search
              - web_fetch
          - when: constrains
            capability: single-mcp-operation
            field: disallowedTools
            members:
              - web_search
              - web_fetch

policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/agents/README.md"
          schema: governance
    internal-link:
      exclude-sources: ["specs/fixtures/**", "plans/done/**"]
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      exclude:
        - "plans/done/**"
        - ".git/**"
        - "**/worktrees/**"
        - "**/node_modules/**"
        - "**/deps/**"
        - "**/coverage/**"
        - "**/playwright-report/**"
        - "**/test-results/**"
      require-default-class: true
      allowed-types:
        - flowchart
        - graph
        - sequenceDiagram
        - stateDiagram-v2
        - erDiagram
      forbid-theme-overrides: true
      canvas-colors:
        - "#FFFFFF"
        - "#0D1117"
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 750 }
        - { glob: "repo-governance/**/*.md", fail: 750 }
    directory-map:
      trees:
        - { path: repo-governance }
        - { path: docs }
        - { path: specs/apps }
        - { path: specs/tools }
        - { path: plans }
    # Owner: repo-governance/development/quality-gate-adapter.md
    quality-gates:
      root: repo-governance/workflows
      agents: .agents/agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
        - family: rules
        - family: harness
        - family: ci
        - family: pr-review
        - family: specs
        - family: ui-web
          subject: apps/bnest-app
          judge: swe-web-tester
          repairer: swe-developer
        - family: api-http
          subject: apps/bnest-app
          judge: swe-api-tester
          repairer: swe-developer

gates:
  composition:
    pull-request: { relation: at-least }
  entries:
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: ./scripts/check-commit-message.sh
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on: { pre-commit: {}, pre-push: {}, pull-request: {} }
    - id: public-safety-range
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_BASE: { input: range.base }
          PUBLIC_SAFETY_HEAD: { input: range.head }
      run-on:
        pre-push:
          bind:
            range: { source: push-updates, fallback: refs/remotes/origin/main }
        pull-request:
          bind:
            range: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The scanner regression suite runs in the isolated pull-request checkout."
    - id: leak-review-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/leak-review/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The record check's offline suite runs where the hosted check is defined."
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {} }
    - id: quality-gates
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: quality-gates },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: harness }, { literal: adapters }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      bnest-app:
        path: apps/bnest-app
        kind: app
        stacks: [elixir, phoenix-liveview, javascript, typescript]
      ex-bdd:
        path: libs/ex-bdd
        kind: library
        stacks: [elixir]
      bnest-app-be-e2e:
        path: apps/bnest-app-be-e2e
        kind: app
        stacks: [typescript]
      bnest-app-fe-e2e:
        path: apps/bnest-app-fe-e2e
        kind: app
        stacks: [typescript]
      rhino-consumer:
        path: apps/rhino-consumer
        kind: tooling
        stacks: [nx]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      ci-scripts:
        path: .github/scripts
        kind: tooling
        stacks: [shell]
      claude-hooks:
        path: .claude/hooks
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
      workspace:
        path: .
        kind: tooling
        stacks: [nx]
