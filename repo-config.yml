# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.7.0/schemas/repo-config/v2.schema.json
# Beaver-Nest consumer policy for the immutable Rhino v0.4.0 release.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - coverage
    - playwright-report
    - test-results
    - worktrees
    - deps

harness:
  canonical:
    agents:
      name: name
      description: description
      grants: requires
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - web-search
      - web-fetch
      - shell
      - nested-agent
      - nx-mcp
    constraints:
      - inline-result-only
      - single-mcp-operation
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          [
            repository-read,
            repository-write,
            web-search,
            web-fetch,
            shell,
            nested-agent,
            nx-mcp,
          ]
        constraints: [inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: web-search,
              field: tools,
              members: [WebSearch],
            }
          - {
              when: requires,
              capability: web-fetch,
              field: tools,
              members: [WebFetch],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: denies,
              capability: repository-write,
              field: tools,
              absent-members: [Write, Edit],
            }
          - {
              when: denies,
              capability: shell,
              field: tools,
              absent-members: [Bash, PowerShell],
            }
          - {
              when: denies,
              capability: nested-agent,
              field: tools,
              absent-members: [Agent, Task],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
    - id: codex
      supports:
        capabilities:
          [
            repository-read,
            repository-write,
            web-search,
            web-fetch,
            shell,
            nested-agent,
            nx-mcp,
          ]
        constraints: [inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        absent: [model, effort]
    - id: opencode
      supports:
        capabilities:
          [
            repository-read,
            repository-write,
            web-search,
            web-fetch,
            shell,
            nested-agent,
            nx-mcp,
          ]
        constraints: [inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: web-search,
              field: permission,
              entries: { websearch: allow },
            }
          - {
              when: requires,
              capability: web-fetch,
              field: permission,
              entries: { webfetch: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: denies,
              capability: repository-write,
              field: permission,
              entries: { edit: deny },
            }
          - {
              when: denies,
              capability: shell,
              field: permission,
              entries: { bash: deny },
            }
          - {
              when: denies,
              capability: nested-agent,
              field: permission,
              entries: { task: deny },
            }

policies:
  markdown:
    internal-link:
      exclude-sources: ["specs/fixtures/**", "plans/done/**"]
    mermaid:
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors:
        ["#0173B2", "#DE8F05", "#029E73", "#CC78BC", "#CA9161", "#808080"]
      edge-colors:
        [
          "#0173B2",
          "#DE8F05",
          "#029E73",
          "#CC78BC",
          "#CA9161",
          "#808080",
          "#000000",
        ]
      text-colors: ["#000000", "#FFFFFF"]
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 750 }
        - { glob: "repo-governance/**/*.md", fail: 750 }
    directory-map:
      trees:
        - { path: repo-governance }
        - { path: docs }
        - { path: specs/apps }
        - { path: specs/tools }
        - { path: plans }

gates:
  composition:
    pull-request: { relation: at-least }
  entries:
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: ./scripts/check-commit-message.sh
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on: { pre-commit: {}, pre-push: {}, pull-request: {} }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The scanner regression suite runs in the isolated pull-request checkout."
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: harness }, { literal: adapters }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {} }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      bnest-app:
        path: apps/bnest-app
        kind: app
        stacks: [elixir, phoenix-liveview, javascript, typescript]
      ex-bdd:
        path: libs/ex-bdd
        kind: library
        stacks: [elixir]
      bnest-app-be-e2e:
        path: apps/bnest-app-be-e2e
        kind: app
        stacks: [typescript]
      bnest-app-fe-e2e:
        path: apps/bnest-app-fe-e2e
        kind: app
        stacks: [typescript]
      rhino-consumer:
        path: apps/rhino-consumer
        kind: tooling
        stacks: [nx]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      ci-scripts:
        path: .github/scripts
        kind: tooling
        stacks: [shell]
      claude-hooks:
        path: .claude/hooks
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
      workspace:
        path: .
        kind: tooling
        stacks: [nx]
