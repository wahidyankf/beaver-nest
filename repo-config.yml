# Repository configuration -- ose/repo-config/v2
#
# What this repository enforces about its own documentation, and what must pass
# before a change lands, declared rather than compiled in.
#
# Every validator value below is unchanged. The v1 file already carried them,
# each one transcribed from the retired Badakmini validator -- its
# Governance.fs, its HarnessContract.fs, and the eight invocations its
# project.json composed -- and none of those reasons stopped being true because
# the schema did. That project no longer exists; the history is in plans/, and
# these values are still the only statement of the policy.
#
# What v2 adds is the two things v1 could only imply: who may read this
# repository, and which checks run at which moment. Both were previously spread
# across a shell script, an Nx target and three hooks, which is three places to
# look and three places to forget.
#
# The key order is fixed by v2 rather than chosen here, so a reader comparing
# two repositories' configurations compares like with like.
#
# Nothing here is a runtime value. No host, no path outside the repository, no
# credential: see repo-governance/conventions/public-repository-data-safety.md.

schema: ose/repo-config/v2

# Public, and gated as public. Everything here -- the repository, its history,
# its Actions logs -- is readable by anyone, so the safety gate below runs
# first on every surface rather than last on one of them.
visibility: public

scan:
  exclude-directories:
    - .git
    - .nx
    - node_modules
    - bin
    - obj
    - _build
    - deps
    - coverage
    - playwright-report
    - test-results
    - worktrees

harness-parity:
  canonical:
    instruction: AGENTS.md
    instruction-adapter: CLAUDE.md
    skills-root: .agents/skills
    skill-route:
      "Read {path} completely, resolve every relative resource from that skill
      directory, and follow it as authoritative before acting."
    agents-root: .agents/agents
    agent-route:
      "Before acting, read the complete canonical agent definition at the
      repository-root path {path} and follow it as authoritative. If it cannot
      be read, stop and report the missing path."
    # HarnessContract.fs reads `requires`, `denies` and `constraints`, and
    # requires `mode: subagent` on every canonical agent.
    declaration:
      grants: requires
      denials: denies
      limits: constraints
      fixed: { mode: subagent }
  harnesses:
    # No `codex` entry. Codex reads `AGENTS.md` and `.agents/skills/` natively,
    # but its per-agent configuration has no control that enforces the
    # nested-agent denial every canonical agent declares, and the project
    # config enables multi-agent work. An adapter that drops a denial fails
    # parity by definition, and the roster needs an agent adapter on every
    # declared harness, so Codex is not declared; its nx-mcp entry in
    # .codex/config.toml stays, unreconciled.
    - name: claude
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { name: name, description: description }
        # Every translation below is the one the v1 file declared, rewritten
        # from a flow mapping to a block mapping. Prettier wraps a flow mapping
        # that will not fit the line, and the v2 reader stops reading keys at a
        # flow collection spread over several lines -- which is how `gates`
        # went missing from a file that plainly declares it.
        translations:
          - { when: always, field: tools, members: [Read] }
          - when: requires
            capability: repository-read
            field: tools
            members: [Glob, Grep]
          - when: requires
            capability: web-search
            field: tools
            members: [WebSearch]
          - when: requires
            capability: web-fetch
            field: tools
            members: [WebFetch]
          - when: requires
            capability: repository-write
            field: tools
            members: [Write, Edit]
          - when: requires
            capability: shell
            field: tools
            members: [Bash]
          - when: requires
            capability: nx-mcp
            field: tools
            member-prefix: "mcp__nx-mcp__"
          - when: denies
            capability: repository-write
            field: tools
            absent-members: [Write, Edit]
          - when: denies
            capability: shell
            field: tools
            absent-members: [Bash, PowerShell]
          - when: denies
            capability: nested-agent
            field: tools
            absent-members: [Agent, Task]
      skill-adapter:
        path: ".claude/commands/{name}.md"
        format: front-matter
        route-field: body
        identity: { description: description }
        # parsed.Scalars.Count = 1 and no lists or nested maps: a wrapper
        # declares its description and nothing else.
        closed: true
      capability:
        file: .mcp.json
        format: json
    - name: opencode
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - when: requires
            capability: repository-read
            field: permission
            entries: { glob: allow, grep: allow }
          - when: requires
            capability: web-search
            field: permission
            entries: { websearch: allow }
          - when: requires
            capability: web-fetch
            field: permission
            entries: { webfetch: allow }
          - when: requires
            capability: repository-write
            field: permission
            entries: { edit: allow }
          - when: requires
            capability: shell
            field: permission
            entries: { bash: allow }
          - when: requires
            capability: nx-mcp
            field: permission
            entry-prefix: "nx-mcp_"
            entry-value: allow
          - when: denies
            capability: repository-write
            field: permission
            entries: { edit: deny }
          - when: denies
            capability: shell
            field: permission
            entries: { bash: deny }
          - when: denies
            capability: nested-agent
            field: permission
            entries: { task: deny }
      capability:
        file: opencode.json
        format: json
  required-mcp:
    name: nx-mcp
    command: npx
    args: ["nx", "mcp"]
  # The four shapes the F# treats as competing always-on instruction sources.
  prohibited-instruction-sources:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"
  capabilities:
    - repository-read
    - repository-write
    - web-search
    - web-fetch
    - shell
    - nested-agent
    - nx-mcp
  constraints:
    - inline-result-only
    - single-mcp-operation

governance-word-budget:
  count: letters-and-digits
  # Governance.fs: 750 words over AGENTS.md and every repo-governance document.
  # No warn tier exists in the F#, so none is declared here.
  surfaces:
    - glob: "AGENTS.md"
      fail: 750
    - glob: "repo-governance/**/*.md"
      fail: 750

governance-directory-map:
  # The retired validator defaulted to `repo-governance` alone, but the policy
  # this repository actually ran was four separate `--directory` invocations.
  # Declaring all four here is what made the two gates comparable: one target
  # per tree became one list.
  trees:
    - path: repo-governance
    - path: docs
    # `specs/apps` and `specs/tools` rather than `specs`: a mapped tree is
    # walked whole, and `specs/fixtures/plan-structure` is a copy verified
    # against the catalog's digest. The READMEs the rule would demand inside it
    # are bytes that must not change, and the rule has no exclusion -- so the
    # narrower trees keep every directory this repository actually authors
    # under it. The cost is `specs/README.md`'s own map, which is no longer
    # checked for completeness; hippo accepted the same trade for the same
    # reason.
    - path: specs/apps
    - path: specs/tools
    - path: plans

md-internal-link:
  # Governance.fs skips archived plans as link *sources* only -- they stay
  # valid targets. An archived plan deliberately references paths that no
  # longer exist, and reporting those would make finishing a plan produce
  # findings.
  #
  # The shared plan-structure corpus is excluded for a different reason:
  # several of its rejected cases are documents carrying a deliberately broken
  # link, which is the defect the case exists to make a validator report. The
  # tree is verified against the catalog's digest rather than edited, so a link
  # repaired here to satisfy this rule would break the comparison the corpus is
  # for. Every member carrying the corpus excludes the same path.
  exclude-sources:
    - "specs/fixtures/**"
    - "plans/done/**"

md-mermaid:
  node-label-graphemes: 32
  edge-label-graphemes: 24
  # The F# palette verbatim, including the plain grey RHINO's own configuration
  # rejects. A repository may declare it; RHINO ships none.
  #
  # Block sequences rather than the flow collections v1 carried. Prettier wraps
  # a flow sequence that will not fit the line, and a flow collection spread
  # over several lines is not something the v2 reader accepts -- it stops
  # reading keys there, and `gates` below it goes missing. The values are the
  # same seven, in the same order.
  fill-colors:
    - "#0173B2"
    - "#DE8F05"
    - "#029E73"
    - "#CC78BC"
    - "#CA9161"
    - "#808080"
  edge-colors:
    - "#0173B2"
    - "#DE8F05"
    - "#029E73"
    - "#CC78BC"
    - "#CA9161"
    - "#808080"
    - "#000000"
  text-colors:
    - "#000000"
    - "#FFFFFF"

# What runs, and when. `rhino gate run --surface <name>` resolves the pinned
# release once and runs the gates that name the surface, in the order they are
# declared here. That single resolution is what
# `apps/rhino-consumer/repository-gate.sh` and the `--bootstrap-exec` flag in
# this repository's forked bootstrap existed to obtain by hand; both retire
# with this section.
#
# `public-safety` is first on every surface it appears on. A gate that screens
# what leaves the repository is worth nothing if a cheaper check ahead of it
# can pass the change through while it is still queued.
gates:
  - id: public-safety
    kind: check
    run:
      - bash
      - scripts/public-safety/check.sh
    surfaces:
      - commit-msg
      - pre-commit
      - pre-push
      - ci

  - id: public-safety-tests
    kind: check
    run:
      - bash
      - scripts/public-safety/tests/run.sh
    surfaces:
      - ci

  - id: commit-message
    kind: check
    run:
      - npm
      - exec
      - --
      - commitlint
      - --edit
    surfaces:
      - commit-msg

  - id: format-staged
    kind: mutation
    run:
      - npm
      - exec
      - --
      - lint-staged
    surfaces:
      - pre-commit

  # The six checks `repository-gate.sh` ran, in the order it started them.
  # Their combination was the only thing that file owned, and this is where
  # that now lives.
  - id: repo-config
    kind: check
    run:
      - ./rhino
      - repo-config
      - validate
    surfaces:
      - ci

  - id: word-budget
    kind: check
    run:
      - ./rhino
      - governance
      - word-budget
      - validate
    surfaces:
      - ci

  - id: directory-map
    kind: check
    run:
      - ./rhino
      - governance
      - directory-map
      - validate
    surfaces:
      - ci

  - id: harness-parity
    kind: check
    run:
      - ./rhino
      - harness
      - parity
      - validate
    surfaces:
      - ci

  - id: internal-link
    kind: check
    run:
      - ./rhino
      - md
      - internal-link
      - validate
    surfaces:
      - ci

  - id: mermaid
    kind: check
    run:
      - ./rhino
      - md
      - mermaid
      - validate
    surfaces:
      - ci
  # Declared once the live plans validated clean. Without it, structural decay
  # in a plan is something a reader notices rather than something a surface
  # refuses, which is the whole point of a structural validator.
  - id: plan
    kind: check
    run:
      - ./rhino
      - plan
      - validate
    surfaces:
      - ci
