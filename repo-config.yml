# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.19.0/schemas/repo-config/v2.schema.json
# Beaver-Nest consumer policy for the immutable Rhino v0.19.0 release.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - coverage
    - playwright-report
    - test-results
    - worktrees
    - deps

harness:
  agents-root: agents
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
      dispatches: dispatches
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
      - inline-result-only
      - single-mcp-operation
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        dispatches: { field: tools, format: "Agent({names})" }
        empty-tier: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: requires,
              capability: network,
              field: tools,
              members: [WebSearch, WebFetch],
            }
          - {
              when: constrains,
              capability: read-only,
              field: tools,
              absent-members: [Write, Edit],
            }
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        ultra: { model: opus, effort: high }
        plan: { model: sonnet, effort: high }
        execution: { model: haiku, effort: high }
        fast: { model: haiku, effort: medium }
    - id: codex
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: model_reasoning_effort }
      tiers:
        ultra:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-sol
            fallback: gpt-6-sol
          effort: high
        plan:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-sol
            fallback: gpt-6-sol
          effort: high
        execution:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-terra
            fallback: gpt-6.1-terra
          effort: high
        fast:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-terra
            fallback: gpt-6.1-terra
          effort: medium
    - id: opencode
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints: [read-only, inline-result-only, single-mcp-operation]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        dispatches: { field: permission.task, format: allow-map }
        translations:
          # Deny by default; each granted capability below re-allows its entry.
          - {
              when: always,
              field: permission,
              entries:
                {
                  read: allow,
                  edit: deny,
                  bash: deny,
                  webfetch: deny,
                  websearch: deny,
                },
            }
          - { when: no-dispatches, field: permission, entries: { task: deny } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: requires,
              capability: network,
              field: permission,
              entries: { webfetch: allow, websearch: allow },
            }
    - id: commandcode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
          - single-mcp-operation
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".commandcode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: |-
          Before acting, read the complete canonical agent definition at the repository-root path
          {path} and follow it as authoritative.
          If it cannot be read, stop and report the missing path.
        identity:
          name: name
          description: description
        agents:
          - ci-checker
          - ci-fixer
          - ci-monitor-subagent
          - docs-checker
          - docs-fixer
          - harness-checker
          - harness-fixer
          - leak-reviewer
          - plan-checker
          - plan-execution-checker
          - plan-fixer
          - plan-maker
          - pr-review-checker
          - pr-review-fixer
          - rules-checker
          - rules-fixer
          - specs-checker
          - specs-fixer
          - swe-api-tester
          - swe-architect
          - swe-debugger
          - swe-developer
          - swe-infra-tester
          - swe-releaser
          - swe-reviewer
          - swe-usability-tester
          - swe-web-tester
          - web-researcher
        absent:
          - model
          - featureModels
          - effort
          - reasoningEffort
        translations:
          - when: always
            field: tools
            members:
              - read_file
          - when: always
            field: disallowedTools
            members:
              - agent
              - agent_output
          - when: requires
            capability: repository-read
            field: tools
            members:
              - read_directory
              - grep
              - glob
          - when: requires
            capability: repository-write
            field: tools
            members:
              - write_file
              - edit_file
          - when: requires
            capability: shell
            field: tools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: requires
            capability: network
            field: tools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: constrains
            capability: inline-result-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: repository-read
            field: disallowedTools
            members:
              - read_file
              - read_directory
              - grep
              - glob
          - when: denies
            capability: repository-write
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: shell
            field: disallowedTools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: denies
            capability: network
            field: disallowedTools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: single-mcp-operation
            field: tools
            members:
              - mcp__nx-mcp__ci_information
              - mcp__nx-mcp__update_self_healing_fix
          - when: constrains
            capability: single-mcp-operation
            field: tools
            absent-members:
              - web_search
              - web_fetch
          - when: constrains
            capability: single-mcp-operation
            field: disallowedTools
            members:
              - web_search
              - web_fetch
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
    - id: muse
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
          - single-mcp-operation
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".agents/agents/{name}/AGENT.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the repository-root path\n{path} and follow it
          as authoritative.\nIf it cannot be read, stop and report the missing path."
        identity:
          name: name
          description: description
        tier-fields:
          model: model
          effort: effort
      tiers:
        ultra: { model: muse-wonder-1.0, effort: high }
        plan: { model: muse-spark-1.3, effort: xhigh }
        execution: { model: muse-spark-1.3, effort: high }
        fast: { model: muse-spark-1.3, effort: medium }
policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: "agents/*.md"
          schema: agent
        - glob: ".agents/**/README.md"
          schema: governance
        - glob: "agents/**/README.md"
          schema: governance
    internal-link:
      exclude-sources: ["specs/fixtures/**", "plans/done/**"]
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      exclude:
        - "plans/done/**"
        - ".git/**"
        - "**/worktrees/**"
        - "**/node_modules/**"
        - "**/deps/**"
        - "**/coverage/**"
        - "**/playwright-report/**"
        - "**/test-results/**"
      require-default-class: true
      allowed-types:
        - flowchart
        - graph
        - sequenceDiagram
        - stateDiagram-v2
        - erDiagram
      forbid-theme-overrides: true
      canvas-colors:
        - "#FFFFFF"
        - "#0D1117"
  # Initial behaviour policy from phase-8-beaver-nest-behaviour.md. The whole-file list holds only
  # the runners that execute whole feature files and fail on an undefined step (P13): the
  # Playwright BDD steps and the two bootstrap scripts. ExBdd and the Vitest binder are not listed.
  behaviour:
    corpus:
      - specs/apps/bnest/app-be/behaviours
      - specs/apps/bnest/app-fe/behaviours
      - specs/apps/tools/hippo-consumer/behaviours
      - specs/apps/tools/rhino-consumer/behaviours
    fixtures:
      - specs/fixtures
    levels:
      unit:
        - apps/bnest-app/test/unit/**/*.exs
        - apps/bnest-app/assets/test/behaviour/**/*.ts
        - apps/bnest-app/assets/test/unit/**/*.test.ts
      integration:
        - apps/bnest-app/test/integration/**/*.exs
        - apps/bnest-app-fe-e2e/tests/integration/**/*.ts
        - .github/scripts/test-hippo-bootstrap.sh
        - .github/scripts/test-rhino-bootstrap.sh
      e2e:
        - apps/bnest-app-be-e2e/tests/steps/**/*.ts
        - apps/bnest-app-fe-e2e/tests/steps/**/*.ts
    whole-file:
      - apps/bnest-app-be-e2e/tests/steps/**/*.ts
      - apps/bnest-app-fe-e2e/tests/steps/**/*.ts
      - .github/scripts/test-hippo-bootstrap.sh
      - .github/scripts/test-rhino-bootstrap.sh
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 750 }
        - { glob: "repo-governance/**/*.md", fail: 750 }
    directory-map:
      trees:
        - { path: repo-governance }
        - { path: docs }
        - { path: specs/apps }
        - { path: plans }
    # Owner: repo-governance/development/quality-gate-adapter.md
    quality-gates:
      root: repo-governance/workflows
      agents: agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
        - family: rules
        - family: harness
        - family: ci
        - family: pr-review
        - family: specs
        - family: ui-web
          subject: apps/bnest-app
          judge: swe-web-tester
          repairer: swe-developer
        - family: api-http
          subject: apps/bnest-app
          judge: swe-api-tester
          repairer: swe-developer

gates:
  composition:
    pull-request: { relation: at-least }
  # C6 placement. Each local surface holds only the entries its allowed list
  # names (W07). Every other check, test, and document gate runs at pull-request.
  wiring:
    hooks:
      directory: .husky
    ci:
      directory: .github/workflows
    local-surfaces:
      pre-commit: [format-staged]
      commit-msg: [commit-message]
      pre-push: [public-safety-range]
  entries:
    # Local surfaces. A local entry also replays at pull-request, so the hosted
    # gate is never weaker than the hook that ran first.
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: regular-files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: prettier
        args:
          - { literal: --write }
          - { literal: --ignore-unknown }
          - { input: staged.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: ./scripts/check-commit-message.sh
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-range
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check.sh }
        environment:
          PUBLIC_SAFETY_BASE: { input: range.base }
          PUBLIC_SAFETY_HEAD: { input: range.head }
      run-on:
        pre-push:
          bind:
            range: { source: push-updates, fallback: refs/remotes/origin/main }
        pull-request:
          bind:
            range: { source: explicit-range, range: explicit }
    # Pull-request entries. Each one is an extra, so each states its reason.
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check.sh }
      run-on:
        pull-request:
          reason: "C11: the tree scan runs at pull-request; pre-push screens the pushed range alone."
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/tests/run.sh }
      run-on:
        pull-request:
          reason: "The scanner regression suite runs in the isolated pull-request checkout."
    - id: remote-dispatch-refusal
      type: check
      command:
        executable: bash
        args:
          - { literal: scripts/check-remote-dispatch-refusal.sh }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: ui-class-coverage
      type: check
      command:
        executable: ./scripts/check-ui-class-coverage.mjs
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: ui-class-coverage-tests
      type: check
      command:
        executable: node
        args:
          [
            { literal: --test },
            { literal: scripts/check-ui-class-coverage.test.mjs },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: repo-config }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: governance }
          - { literal: word-budget }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: governance }
          - { literal: directory-map }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: quality-gates
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: governance }
          - { literal: quality-gates }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: harness-adapters
      type: check
      command:
        executable: bash
        args:
          - literal: -c
          - literal: "./rhino harness adapters validate && bash .commandcode/hooks/policy-hooks.test.sh && exec bash .muse/hooks/run-policy-hook.test.sh"
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: md }
          - { literal: internal-link }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: md }
          - { literal: mermaid }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: markdownlint
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: markdownlint-cli2 }
          - { literal: "**/*.md" }
          - { literal: "!**/node_modules/**" }
          - { literal: "!worktrees/**" }
      run-on:
        pull-request:
          reason: "C6: the document checks run at pull-request only, never before a push."
    - id: prettier-check
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: prettier }
          - { literal: --check }
          - { literal: --ignore-unknown }
          - { literal: . }
      run-on:
        pull-request:
          reason: "C6: the format gate walks the working tree, so it runs at pull-request only."
    - id: format-elixir
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app }
          - { literal: -t }
          - { literal: format }
      run-on:
        pull-request:
          reason: "C6: the Elixir format check reads the whole project, so it runs at pull-request only."
    - id: commit-history
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: commitlint }
          - { literal: --from }
          - { input: range.base, expand: single }
          - { literal: --to }
          - { input: range.head, expand: single }
          - { literal: --verbose }
      run-on:
        pull-request:
          reason: "C10: each commit in the pull-request range is linted on its own, not as one stream."
          bind:
            range: { source: explicit-range, range: explicit }
    - id: behaviour-coverage
      type: check
      command:
        executable: ./rhino
        args:
          - { literal: behaviour }
          - { literal: coverage }
          - { literal: validate }
      run-on:
        pull-request:
          reason: "C7: a binding and its scenario can sit in any project, so the check is global."
    - id: hippo-bootstrap-test
      type: check
      command:
        executable: ./.github/scripts/test-hippo-bootstrap.sh
      run-on:
        pull-request:
          reason: "C6: the pinned HIPPO bootstrap test runs at pull-request, where its consumer is wired."
    - id: rhino-bootstrap-lint
      type: check
      command:
        executable: shellcheck
        args:
          - { literal: rhino }
          - { literal: .github/scripts/test-rhino-bootstrap.sh }
      run-on:
        pull-request:
          reason: "C6: the RHINO bootstrap is linted at pull-request, where its shell is wired."
    - id: rhino-consumer-repo
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: rhino-consumer }
          - { literal: -t }
          - { literal: test:repo }
      run-on:
        pull-request:
          reason: "C6: the repository contract that pre-push used to run now runs at pull-request."
    # Per-project and per-level test entries. The pull-request workflow runs each
    # one in its own parallel job, selected with `--entry`.
    - id: test-quick-bnest-app
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app }
          - { literal: -t }
          - { literal: test:quick }
      run-on:
        pull-request:
          reason: "C8: each project's quick suite runs in its own parallel pull-request job."
    - id: test-quick-bnest-app-be-e2e
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app-be-e2e }
          - { literal: -t }
          - { literal: test:quick }
      run-on:
        pull-request:
          reason: "C8: each project's quick suite runs in its own parallel pull-request job."
    - id: test-quick-bnest-app-fe-e2e
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app-fe-e2e }
          - { literal: -t }
          - { literal: test:quick }
      run-on:
        pull-request:
          reason: "C8: each project's quick suite runs in its own parallel pull-request job."
    - id: test-integration
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run-many }
          - { literal: -t }
          - { literal: test:integration }
      run-on:
        pull-request:
          reason: "C17: the integration suite runs on every pull request, not only on a schedule."
    # Scheduled entries. The scheduled workflow runs them; no pull request waits for them.
    - id: test-e2e-be
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app-be-e2e }
          - { literal: -t }
          - { literal: test:e2e }
          - { literal: -- }
          - { literal: --workers=1 }
      run-on:
        scheduled: {}
    - id: test-e2e-fe
      type: check
      command:
        executable: npm
        args:
          - { literal: exec }
          - { literal: --no }
          - { literal: -- }
          - { literal: nx }
          - { literal: run }
          - { literal: -p }
          - { literal: bnest-app-fe-e2e }
          - { literal: -t }
          - { literal: test:e2e }
          - { literal: -- }
          - { literal: --workers=1 }
      run-on:
        scheduled: {}

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      bnest-app:
        path: apps/bnest-app
        kind: app
        stacks: [elixir, phoenix-liveview, javascript, typescript]
      bnest-app-be-e2e:
        path: apps/bnest-app-be-e2e
        kind: app
        stacks: [typescript]
      bnest-app-fe-e2e:
        path: apps/bnest-app-fe-e2e
        kind: app
        stacks: [typescript]
      rhino-consumer:
        path: apps/rhino-consumer
        kind: tooling
        stacks: [nx]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      ci-scripts:
        path: .github/scripts
        kind: tooling
        stacks: [shell]
      claude-hooks:
        path: .claude/hooks
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
      workspace:
        path: .
        kind: tooling
        stacks: [nx]
